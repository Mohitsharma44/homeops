# Plain HTTP never reaches a backend: every known host gets a 308 to HTTPS
# (method-preserving, = ingress-nginx's force-ssl-redirect code),
# anything else gets Envoy's 404. (ingress-nginx did NOT redirect Grafana,
# which had no TLS block; redirecting it here is a deliberate tightening.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: eg-home
      sectionName: http
  hostnames:
    - argocd.sharmamohit.com
    - rook-ceph.sharmamohit.com
    - grafana.sharmamohit.com
    - kaneo.sharmamohit.com
    - prometheus.sharmamohit.com
    - loki.sharmamohit.com
    - drive.proxy.sharmamohit.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
