apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer.yaml
  - default-tls-cert.yaml
  - ipaddressPool.yaml
  - ceph-cluster.yaml
  - ceph/
  - monitoring-ns.yaml
  - thanos-objstore-secret.yaml
  # Loki and Tempo credentials. One scoped key per consumer; replaced
  # seaweedfs-s3-secret, which is gone along with the host it named.
  - object-store-credentials.yaml
  - monitoring-basic-auth-secret.yaml
  - alertmanager-slack-secret.yaml
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml
  - argocd-oidc-secret.yaml
  - monitoring-ingress.yaml
  - pangolin-ns.yaml
  - newt-credentials-secret.yaml
  - kaneo-ns.yaml
  - kaneo-secret.yaml
  # Self-hosted drive (SFTPGo) — ticket 16e. Declares the `sftpgo` namespace and
  # the TLS certificate for drive.proxy.sharmamohit.com. A separate certificate is
  # required because default-tls-cert above is one label deep and does not cover a
  # two-label-deep name. Read the header of the file before changing it.
  - drive-tls-cert.yaml
