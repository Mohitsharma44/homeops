apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-issuer.yaml
  - default-tls-cert.yaml
  - ipaddressPool.yaml
  - ceph-cluster.yaml
  - ceph/
  - monitoring-ns.yaml
  - thanos-objstore-secret.yaml
  # Loki and Tempo credentials. One scoped key per consumer; replaced
  # seaweedfs-s3-secret, which is gone along with the host it named.
  - object-store-credentials.yaml
  - monitoring-basic-auth-secret.yaml
  - alertmanager-slack-secret.yaml
  - grafana-admin-secret.yaml
  - grafana-oidc-secret.yaml
  - argocd-oidc-secret.yaml
  - monitoring-ingress.yaml
  - pangolin-ns.yaml
  - newt-credentials-secret.yaml
  - kaneo-ns.yaml
  - kaneo-secret.yaml
  # Self-hosted drive (SFTPGo) — ticket 16. Order matters only for the first
  # entry: drive-tls-cert.yaml is the file that DECLARES the `sftpgo` Namespace,
  # so it must stay above the four objects that live in it. Do not add a second
  # Namespace manifest — a duplicate in one kustomization is a build error.
  #
  # A separate certificate is required because default-tls-cert above is
  # sharmamohit.com + *.sharmamohit.com, one label deep, and a wildcard does not
  # span two labels. Read each file's header before changing it.
  - drive-tls-cert.yaml
  # Garage bucket key, scoped read+write to drive-files only (16b).
  - drive-object-store-credentials.yaml
  # PocketID client id + secret (16d). The client id is pinned rather than
  # generated, so this can be applied before the PocketID client exists; until
  # it does, OIDC login fails while everything else runs.
  - drive-oidc-secret.yaml
  # KMS master key + first-run installation code (16c).
  - drive-app-secret.yaml
  # The declarative authorisation design replayed at every pod start (16c).
  # Changing it does NOT restart the pod on its own — bump
  # podAnnotations loaddata-revision in the sftpgo Application in the same commit.
  - drive-loaddata-configmap.yaml
