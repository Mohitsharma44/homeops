---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
  namespace: rook-ceph
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: "1.19.x"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 12h
  timeout: 10m
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    remediation:
      retries: -1 # keep trying to remediate
    crds: CreateReplace # Upgrade CRDs on package update
  releaseName: rook-ceph-cluster
  values:
    toolbox:
      enabled: true
    monitoring:
      enabled: true
      createPrometheusRules: true
    # Keep the running Ceph version fixed during CephX key rotation.
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v19.2.6
    cephClusterSpec:
      security:
        cephx:
          daemon:
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          csi:
            # AES256K kernel mounts require Linux >=7.0; keep CSI on AES.
            keyType: aes
      healthCheck:
        muteHealthWarning:
          # Revisit after every Talos node runs kernel >=7.0 and CSI keys migrate.
          AUTH_INSECURE_CLIENT_KEY_TYPE:
            policy: mute
          # Revisit after kernel >=7.0 and all client keys migrate to AES256K.
          AUTH_INSECURE_KEYS_ALLOWED:
            policy: mute
          # Revisit after kernel >=7.0 and all client keys migrate to AES256K.
          AUTH_INSECURE_KEYS_CREATABLE:
            policy: mute
      storage:
        useAllNodes: true
        useAllDevices: true
    # Sub-resources managed by standalone manifests in ceph/
    cephBlockPools: []
    cephFileSystems: []
    cephObjectStores: []
    ingress:
      dashboard:
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          nginx.ingress.kubernetes.io/ssl-passthrough: "true"
        host:
          name: rook-ceph.sharmamohit.com
          path: "/"
