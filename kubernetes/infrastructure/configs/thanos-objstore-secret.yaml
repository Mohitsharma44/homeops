# Thanos object storage config. Read by the Thanos compactor and storegateway
# AND by the Prometheus Thanos sidecar in kube-prometheus-stack, so a change here
# restarts the Prometheus pod.
#
# Kept named "thanos-objstore-secret" on purpose -- "objstore" is Thanos's own
# vocabulary (ticket 04). The other consumers use "object-store-credentials".
#
# region must match Garage's s3_region. Garage validates the SigV4 region, so
# "us-east-1" here fails authentication and looks like bad credentials.
apiVersion: v1
kind: Secret
metadata:
    name: thanos-objstore-secret
    namespace: monitoring
type: Opaque
