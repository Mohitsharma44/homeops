# Application-level secrets for the self-hosted drive (SFTPGo) — ticket 16c.
#
# Two independent values, both generated here and existing nowhere else in
# plaintext. Neither is a credential for another system, so neither has to be
# copied anywhere by hand.
#
# kms-master-key
# --------------
# Mounted as a FILE at /run/sftpgo-kms/master.key and named by
# `kms.secrets.master_key_path`. SFTPGo's shipped default is
# `kms.secrets.master_key: ""`, which means secrets stored in the data provider
# — including the Garage secret key that lives inside the drive_users group's
# `user_settings.filesystem.s3config.access_secret` — are AES-256-GCM'd with a
# key derived and stored beside the ciphertext. That is obfuscation, not
# protection: anyone with the SQLite file has both halves. With a master key the
# SQLite file on the Ceph PVC (and any snapshot of it) is useless on its own.
#
# Losing this value is recoverable, deliberately: the loaddata ConfigMap is
# replayed at every pod start with SFTPGO_LOADDATA_MODE=0, so the group — and
# with it the Garage secret — is rewritten and re-encrypted under whatever master
# key is current. Rotating it costs one pod restart, not a rebuild.
#
# installation-code
# -----------------
# Gates SFTPGo's first-run admin setup page. This matters more than it looks.
# In internal/httpd/server.go (v2.7.5) at lines 233, 623 and 1219, `/`,
# /web/client/login and /web/admin/login all 302 to /web/admin/setup while
# `dataprovider.HasAdmin()` is false — that is, from the moment the pod is up
# until the first OIDC admin logs in. Whoever reaches that page first claims the
# SFTPGo super-admin account. server.go:704 refuses the setup POST unless the
# submitted code equals this value, which closes that window.
#
# Consumed as SFTPGO_HTTPD__SETUP__INSTALLATION_CODE, not via the ConfigMap:
# the chart renders `config:` verbatim into a plaintext ConfigMap
# (templates/configmap.yaml: `sftpgo.json: |- {{ toJson .Values.config }}`), so
# nothing secret may go there.
apiVersion: v1
kind: Secret
metadata:
    name: drive-app
    namespace: sftpgo
type: Opaque
stringData:
    kms-master-key: ENC[AES256_GCM,data:7Rr+h4jr6zMJ6XrDcrtIXyKZC01PJFiLo0rEG/Ev5FTXWUzmdfFY+HXxI1ZyXDQcdbdvw65Kyy9GDcax9p9jpA==,iv:Ga0ptDZDIXyMWbDN7FSP4llNECcGe5VO77JeURdhgBY=,tag:oBlIfM4NB2XBsxXPYSuIyw==,type:str]
    installation-code: ENC[AES256_GCM,data:8vLZQuNiLOXji0bUJIu6Hp11Vt8Vmd5mgXkdTxSO+wk=,iv:5wjmFGpcb3QxsvG0g8AjHxqiOjL86w8I+wVY/+E0JVk=,tag:cWJTKsEkXB213tiui8R+Aw==,type:str]
