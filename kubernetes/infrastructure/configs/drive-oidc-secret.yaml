# PocketID OIDC credentials for the self-hosted drive (SFTPGo) — ticket 16d.
#
# Shape copied deliberately from grafana-oidc-secret.yaml in this directory, which
# is the working prior art for a PocketID client in this estate.
#
# THE CLIENT ID IS FIXED, NOT GENERATED
# -------------------------------------
# PocketID accepts a caller-supplied client id on POST /api/oidc/clients
# (OidcClientCreateDto.ID, validated against ^[a-zA-Z0-9._-]+$). It is pinned to
# `sftpgo-drive` here so 16c could write the manifests before the client existed.
#
# THE CLIENT SECRET IS CHOSEN HERE, NOT READ BACK FROM POCKETID
# -------------------------------------------------------------
# POST /api/oidc/clients/{id}/secret takes an OPTIONAL body {"secret": "..."}
# (min 16, printascii). Passing that body SETS the secret instead of generating
# one, so this file is the source of truth and nothing has to be copied back out
# of PocketID by hand. The value below was generated with
# `tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48` and has never existed in
# plaintext outside this SOPS envelope.
#
# NAMESPACE
# ---------
# `sftpgo`, matching drive-tls-cert.yaml (ticket 16e), which is the file that
# declares the Namespace object. NOTE a live disagreement between sibling
# tickets: drive-object-store-credentials.yaml (ticket 16b) uses namespace
# `drive`. One of the two must move before 16f; recorded in the Comments of
# 16d-identity.md and 16-PROGRESS-16d.md.
#
# WIRING — deliberately NOT in kustomization.yaml yet
# ---------------------------------------------------
# This file is intentionally absent from kustomization.yaml until the PocketID
# client actually exists (see the runbook in the Answer of 16d-identity.md).
# Applying the Secret before the client exists would give SFTPGo credentials
# that authenticate against nothing, and OIDC failures present as opaque errors.
# Adding the one line is 16c/16f's job, after the runbook has been run.
