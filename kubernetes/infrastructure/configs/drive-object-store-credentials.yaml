# Credentials for the drive's bucket in the object store (Garage) at
# objects.sharmamohit.com:3900. Created by ticket 16b, for the drive (SFTPGo).
#
# Non-secret values the consumer also needs, kept here in cleartext on purpose
# so they stay legible in git:
#
#   bucket:   drive-files
#   endpoint: objects.sharmamohit.com:3900   (plaintext HTTP, LAN only -- there is
#             deliberately no public DNS record for this name, ticket 04)
#   region:   garage
#
# region must match Garage's s3_region. Set it to "garage"; a consumer that sends
# "us-east-1" is signing outside the documented contract. (Measured on Garage
# v2.3.0 during 16b: this build does NOT in fact reject a mismatched SigV4
# region -- see the ticket. Do not rely on that, and do not use it to diagnose an
# auth failure in either direction.)
#
# The key is scoped in Garage to drive-files ONLY, read+write, no owner, and
# createBucket=false -- exactly like the three observability keys. Verified
# 2026-08-17 by a 5 MiB PUT/GET/byte-compare round trip plus 4/4 PUT and 4/4 LIST
# denials against loki-chunks, loki-ruler, tempo-traces and thanos-metrics.
#
# The bucket carries a server-side 2 TiB hard quota (2199023255552 bytes,
# 15 Q14). Enforcement was proved functionally, not read off a status field.
#
# INERT until ticket 16c references it: this file is deliberately NOT in
# kustomization.yaml, because namespace "drive" does not exist yet. 16c must
# create the namespace, add both to kustomization.yaml, and change the namespace
# here if it settles on a different one.
