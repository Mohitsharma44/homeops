# The two push routes. They live in envoy-gateway-system because only that
# namespace may attach to the https-prometheus / https-loki listeners, and
# their only backend is the auth proxy (../README.md). No requestBuffer here:
# the proxy enforces 10 MiB after authenticating, so Envoy never buffers an
# unauthenticated body.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-remote-write
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: eg-home
      sectionName: https-prometheus
  hostnames:
    - prometheus.sharmamohit.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/write
      backendRefs:
        - name: push-auth-proxy
          namespace: monitoring
          port: 8080
      timeouts:
        request: 0s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-push
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: eg-home
      sectionName: https-loki
  hostnames:
    - loki.sharmamohit.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /loki/api/v1/push
      backendRefs:
        - name: push-auth-proxy
          namespace: monitoring
          port: 8080
      timeouts:
        request: 0s
---
# nginx proxy-read-timeout 300 was an INACTIVITY timer with no total deadline;
# same here: stream idle 300 s, `request: 0s`. Losing this policy only shortens
# idle to the listener's 60 s (availability, never auth).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: push-timeouts
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus-remote-write
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: loki-push
  timeout:
    http:
      streamIdleTimeout: 300s
