---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: metallb-system
      interval: 12h
  values:
    # This cluster is pure L2 (one IPAddressPool + one L2Advertisement, no
    # BGPPeer/BGPAdvertisement). Chart 0.16.0 made frr-k8s the default BGP
    # backend and ships it enabled, so it must be turned off explicitly —
    # speaker.frr.enabled only governs the older, now-deprecated FRR mode
    # and does NOT suppress frr-k8s.
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
      ignoreExcludeLB: true
    prometheus:
      rbacPrometheus: true
      serviceAccount: kube-prometheus-stack-prometheus
      namespace: monitoring
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
