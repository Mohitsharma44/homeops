---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 30m
  timeout: 5m
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    remediation:
      retries: 3
  chart:
    spec:
      chart: ingress-nginx
      version: "4.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
      interval: 12h
  values:
    defaultBackend:
      enabled: true
    controller:
      ingressClassResource:
        default: true
      extraArgs:
        # This should match the ns/secret
        default-ssl-certificate: "ingress-nginx/default-tls-cert"
      autoscaling:
        enabled: true
        maxReplicas: 3
        behavior:
          scaleDown:
            stabilizationWindowSeconds: 300
            policies:
            - type: Pods
              value: 1
              periodSeconds: 180
          scaleUp:
            stabilizationWindowSeconds: 300
            policies:
            - type: Pods
              value: 2
              periodSeconds: 60
      service:
        type: "LoadBalancer"
        loadBalancerIP: 192.168.11.90
      admissionWebhooks:
        enabled: false
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true
          rules:
            # These are just some sample rules
            - alert: NGINXConfigFailed
              expr: count(nginx_ingress_controller_config_last_reload_successful == 0) > 0
              for: 1s
              labels:
                severity: critical
              annotations:
                description: bad ingress config - nginx config test failed
                summary: uninstall the latest ingress changes to allow config reloads to resume
            - alert: NGINXCertificateExpiry
              expr: (avg(nginx_ingress_controller_ssl_expire_time_seconds) by (host) - time()) < 604800
              for: 1s
              labels:
                severity: critical
              annotations:
                description: ssl certificate(s) will expire in less then a week
                summary: renew expiring certificates to avoid downtime
            # These two MUST use rate(). The upstream-example form divides raw
            # counters -- `sum(requests{status=~"5.+"}) / sum(requests)` -- which
            # is the ratio over all history since the counters started, not the
            # ratio now. Counters only ever increase, so once that crosses the
            # threshold it can NEVER come back down and the alert latches
            # permanently.
            #
            # That is not hypothetical: NGINXTooMany500s fired continuously
            # because the cumulative ratio sat at 22.3% while the actual 30m
            # rate was 0%. It re-notified Slack every 6h reporting an incident
            # that had long since ended. NGINXTooMany400s had the identical bug
            # and would have latched the same way on its first bad spell.
            #
            # 15m windows: long enough that a single failed request on a quiet
            # ingress does not trip 5%, short enough to still catch a real
            # outage promptly.
            - alert: NGINXTooMany500s
              expr: 100 * ( sum(rate(nginx_ingress_controller_requests{status=~"5.."}[15m])) / sum(rate(nginx_ingress_controller_requests[15m])) ) > 5
              for: 5m
              labels:
                severity: warning
              annotations:
                description: Too many 5XXs
                summary: More than 5% of requests in the last 15 minutes returned 5XX, this requires your attention
            - alert: NGINXTooMany400s
              expr: 100 * ( sum(rate(nginx_ingress_controller_requests{status=~"4.."}[15m])) / sum(rate(nginx_ingress_controller_requests[15m])) ) > 5
              for: 5m
              labels:
                severity: warning
              annotations:
                description: Too many 4XXs
                summary: More than 5% of requests in the last 15 minutes returned 4XX, this requires your attention
