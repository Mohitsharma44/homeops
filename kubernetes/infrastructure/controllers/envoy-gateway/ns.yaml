# Envoy Gateway control plane AND the Envoy proxy fleet (ControllerNamespace
# deploy mode: the proxies run here too, not in the Gateway's namespace).
#
# enforce=restricted: the controller, the certgen hook Job and the generated
# proxy Deployment all run non-root with seccomp RuntimeDefault, no privilege
# escalation and every capability dropped. Checked before tightening: a
# server-side dry-run of this label against the running pods gave no
# warnings, and audit/warn (restricted since the namespace was created)
# recorded no violations. Never relax to privileged: nothing here needs it.
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
