# The controller chart is pinned by OCI manifest digest (the digest wins over
# the tag; the tag is kept for humans). EXACT pins only: read every release
# note in a crossed range before bumping, and re-run the Go toolchain CVE gate
# (`go version <binary>` + govulncheck -mode=binary) on the new image.
#
# v1.9.4 was chosen over v1.10.0 on 2026-11-23: the 1.10.0 controller binary is
# built with go1.27.3 and govulncheck reports GO-2026-6859 (net/http) as
# reachable; 1.9.4 is go1.26.11 (latest 1.26 patch) with no reachable vulns.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 12h
  url: oci://docker.io/envoyproxy/gateway-helm
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    tag: v1.9.4
    digest: sha256:34ea35e4e79924115ed18f454caaa26d0d416cd5536de53f10a2b1f419776e44
