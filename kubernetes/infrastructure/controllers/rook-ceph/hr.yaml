          name: ceph-csi-nfs-nodeplugin-sa
          namespace: rook-ceph
        patch: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ceph-csi-nfs-nodeplugin-sa
            annotations:
              helm.sh/resource-policy: keep
            namespace: rook-ceph
      - target:
          kind: ServiceAccount
          name: ceph-csi-nvmeof-ctrlplugin-sa
          namespace: rook-ceph
        patch: |
          apiVersion: v1
