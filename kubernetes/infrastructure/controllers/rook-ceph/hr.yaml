          metadata:
            name: ceph-csi-nvmeof-nodeplugin-sa
            annotations:
              helm.sh/resource-policy: keep
            namespace: rook-ceph
      - target:
          kind: ServiceAccount
          name: ceph-csi-rbd-ctrlplugin-sa
          namespace: rook-ceph
        patch: |
          apiVersion: v1
