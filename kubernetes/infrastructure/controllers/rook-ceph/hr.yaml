---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      version: 1.20.10
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
      interval: 12h
  timeout: 10m
  install:
    remediation:
      retries: 0
      remediateLastFailure: false
    crds: CreateReplace
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: false
    crds: CreateReplace
  releaseName: rook-ceph
  values:
    monitoring:
      enabled: true
    deleteUnusedCrushRules: false
    csi:
      createCsiOperatorResources: true
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: ServiceAccount
          name: ceph-csi-cephfs-ctrlplugin-sa
          namespace: rook-ceph
        patch: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ceph-csi-cephfs-ctrlplugin-sa
            annotations:
              helm.sh/resource-policy: keep
            namespace: rook-ceph
      - target:
          kind: ServiceAccount
          name: ceph-csi-cephfs-nodeplugin-sa
          namespace: rook-ceph
        patch: |
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ceph-csi-cephfs-nodeplugin-sa
            annotations:
              helm.sh/resource-policy: keep
            namespace: rook-ceph
      - target:
