---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/controllers
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/configs
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
# Envoy Gateway configuration (P12). Depends on infra-envoy-gateway (Gateway
# API + EG CRDs, controller Ready; clusters/minipcs/envoy-gateway.yaml),
# infra-controllers (cert-manager, MetalLB), infra-configs (the
# monitoring/kaneo/sftpgo namespaces and the monitoring-basic-auth Secret) and
# apps (the argocd namespace). Nothing depends on it, so a bad route cannot
# block the chain.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-envoy-gateway
    - name: infra-controllers
    - name: infra-configs
    - name: apps
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/gateway
  prune: true
  wait: true

---
# Monitoring push endpoints, step 1 of 2: the authenticating proxy.
# wait: true = Ready only when push-auth-proxy has its replicas available.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway-push-auth
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/gateway-push/auth
  prune: true
  wait: true

---
# Monitoring push endpoints, step 2 of 2: ReferenceGrant + routes. Applied only
# after the proxy is healthy and the Gateway exists. Tear down in reverse (this
# one first). The routes cannot forward without the proxy anyway
# (gateway-push/README.md); the order only avoids a 500/503 window.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-gateway-push
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-gateway-push-auth
    - name: infra-gateway
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/gateway-push/routes
  prune: true
  wait: true
