apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: newt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.fossorial.io
    chart: newt
    targetRevision: "1.6.0"
    helm:
      valuesObject:
        global:
          image:
            tag: "1.20.1"
          # Chart >=1.2 turns probes off and sets no resources by default;
          # keep the 1.1.0 behaviour explicitly (no CPU limit, per chart advice:
          # throttling the WireGuard data path degrades it silently).
          health:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
        newtInstances:
          - name: homelab-k8s
            enabled: true
            auth:
              existingSecretName: newt-credentials
              keys:
                endpointKey: PANGOLIN_ENDPOINT
                idKey: NEWT_ID
                secretKey: NEWT_SECRET
            service:
              enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: pangolin
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
