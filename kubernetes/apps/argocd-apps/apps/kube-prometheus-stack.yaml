                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: NoData
