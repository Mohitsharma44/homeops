                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'NVMe media errors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-nvme-crit
                      title: SmartNvmeCriticalWarning
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_critical_warning'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
