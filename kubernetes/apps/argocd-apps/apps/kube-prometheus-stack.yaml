apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "85.x"
    helm:
      valuesObject:
        # CRDs are managed by the separate prometheus-operator-crds Application
        # (sync-wave -1). See docs/monitoring.md "CRD lifecycle" for the
        # upgrade workflow and version invariant.
        crds:
          enabled: false
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            retention: 3d
            retentionSize: 15GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
            externalLabels:
              cluster: minipcs
              environment: homelab
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            thanos:
              objectStorageConfig:
                existingSecret:
                  name: thanos-objstore-secret
                  key: objstore.yml
          thanosService:
            enabled: true
          thanosServiceMonitor:
            enabled: true
        grafana:
          # Use SOPS-encrypted Secret (applied by Flux from
          # kubernetes/infrastructure/configs/grafana-admin-secret.yaml)
          # to prevent Helm from regenerating a random adminPassword on
          # each sync (which would drift from Grafana's DB and break login).
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.sharmamohit.com
          sidecar:
            datasources:
              defaultDatasourceEnabled: false
            dashboards:
              enabled: true
              searchNamespace: monitoring
          # Dashboards managed via Grafana MCP, not helm provisioning
          additionalDataSources:
            - name: Thanos
              type: prometheus
              uid: thanos
              url: http://thanos-query.monitoring.svc:9090
              access: proxy
              isDefault: true
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
              jsonData:
                httpHeaderName1: "X-Scope-OrgID"
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "(?:traceID|trace_id|traceid)=(\\w+)"
                    name: TraceID
                    url: "${__value.raw}"
              secureJsonData:
                httpHeaderValue1: "homelab"
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              access: proxy
              jsonData:
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
          persistence:
            enabled: true
            storageClassName: ceph-block
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          grafana.ini:
            server:
              root_url: https://grafana.sharmamohit.com
            unified_alerting:
              enabled: true
            alerting:
              enabled: false
            # --- PocketID SSO (OIDC) ----------------------------------------
            # Client registered in PocketID UI at https://pocketid.proxy.sharmamohit.com
            # Callback: https://grafana.sharmamohit.com/login/generic_oauth
            # Local admin (grafana-admin secret) remains usable via /login as
            # break-glass — auto_login stays false.
            #
            # Role mapping uses the `groups` claim from PocketID:
            #   group "grafana_admins"  → Admin
            #   group "grafana_editors" → Editor
            #   anything else           → Viewer
            # Names match PocketID's group "Name" field (the claim value), not
            # the "Friendly Name" shown in the UI. Underscores are deliberate.
            # Create those two groups in PocketID and assign users; otherwise
            # all signed-in PocketID users land as Viewer.
            auth:
              disable_login_form: false
              oauth_auto_login: false
            # Config follows PocketID's official Grafana guide
            # (https://pocket-id.org/docs/client-examples/grafana) with two
            # intentional departures (1) signout_redirect_url set so Grafana
            # logout also ends the PocketID session (true SSO logout vs
            # Grafana-only); (2) allow_sign_up: true — PocketID is the access
            # gate (Allowed User Groups on the client), so Grafana auto-
            # provisions instead of duplicating the user roster.
            #
            # role_attribute_strict: true — only users in grafana_admins or
            # grafana_editors can sign in. Anyone else (including users
            # PocketID allowlisted but who aren't in those role groups) is
            # rejected by Grafana with a no-role error. Tighten/loosen here.
            #
            # PocketID quirks:
            # - api_url intentionally omitted: PocketID returns all claims in
            #   the ID token, so Grafana doesn't need a /userinfo round-trip.
            # - email_attribute_name uses Grafana's "email:primary" helper as
            #   PocketID recommends; login/name attributes left to defaults.
            "auth.generic_oauth":
              enabled: true
              name: PocketID
              icon: signin
              allow_sign_up: true
              auto_login: false
              client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid profile email groups
              auth_url: https://pocketid.proxy.sharmamohit.com/authorize
              token_url: https://pocketid.proxy.sharmamohit.com/api/oidc/token
              signout_redirect_url: https://pocketid.proxy.sharmamohit.com/api/oidc/end-session
              use_pkce: true
              use_refresh_token: true
              email_attribute_name: "email:primary"
              role_attribute_path: "contains(groups[*], 'grafana_admins') && 'Admin' || contains(groups[*], 'grafana_editors') && 'Editor' || ''"
              role_attribute_strict: true
          envValueFrom:
            GF_SLACK_WEBHOOK_URL:
              secretKeyRef:
                name: alertmanager-slack-webhook
                key: slack-webhook-url
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-oidc
                key: oauth-client-id
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: oauth-client-secret
          # Grafana Alerting provisioning — sends Slack notifications via Grafana.
          # IMPORTANT: Thresholds here must match additionalPrometheusRulesMap below.
          # Grafana rules feed Slack (via contact point below).
          # Changing a threshold in one place without the other causes drift.
          alerting:
            templates.yaml:
              apiVersion: 1
              templates:
                - orgId: 1
                  name: homelab-slack
                  template: |
                    {{ "{{" }} define "slack.homelab.title" -{{ "}}" }}
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}:fire:{{ "{{" }} else {{ "}}" }}:white_check_mark:{{ "{{" }} end {{ "}}" }} {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
                    {{ "{{" }}- end {{ "}}" }}

                    {{ "{{" }} define "slack.homelab.text" -{{ "}}" }}
                    {{ "{{" }} range .Alerts -{{ "}}" }}
                    *{{ "{{" }} .Labels.severity | toUpper {{ "}}" }}* — {{ "{{" }} .Labels.instance {{ "}}" }}
                    {{ "{{" }} .Annotations.summary {{ "}}" }}
                    :chart_with_upwards_trend: <https://grafana.sharmamohit.com/alerting/list|View Alerts>  {{ "{{" }} if .SilenceURL {{ "}}" }}:no_bell: <{{ "{{" }} .SilenceURL {{ "}}" }}|Silence>{{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} end -{{ "}}" }}
                    {{ "{{" }}- end {{ "}}" }}
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: slack-homelab
                  receivers:
                    - uid: slack-homelab-receiver
                      type: slack
                      disableResolveMessage: false
                      settings:
                        url: $GF_SLACK_WEBHOOK_URL
                        title: '{{ "{{" }} template "slack.homelab.title" . {{ "}}" }}'
                        text: '{{ "{{" }} template "slack.homelab.text" . {{ "}}" }}'
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: slack-homelab
                  group_by:
                    - grafana_folder
                    - alertname
                  group_wait: 3m
                  group_interval: 10m
                  repeat_interval: 6h
                  routes:
                    # "The monitoring is broken" -- ONE message, not nineteen.
                    # execErrState: Error makes every rule emit DatasourceError
                    # instead of impersonating an infrastructure failure, and
                    # noDataState: NoData emits DatasourceNoData. Without this
                    # route a single Thanos hiccup would fan out to one Slack
                    # thread per rule. Must stay FIRST and continue:false.
                    - receiver: slack-homelab
                      object_matchers:
                        - ["alertname", "=~", "DatasourceError|DatasourceNoData|DatasourceTimeout"]
                      group_by:
                        - alertname
                      group_wait: 5m
                      group_interval: 30m
                      repeat_interval: 12h
                      continue: false
                    - receiver: slack-homelab
                      object_matchers:
                        - ["severity", "=", "none"]
                      group_wait: 8760h
                      repeat_interval: 8760h
                      continue: false
                    # group_by is deliberately JUST instance. Grouping is a
                    # partition, so MORE labels means MORE Slack threads, not
                    # fewer: with [alertname, instance] the 2026-08-19 outage
                    # opened 13 separate threads for one dead host. Keyed on
                    # instance alone, everything wrong with a given host arrives
                    # as a single message. The trade-off, accepted knowingly: two
                    # unrelated problems on the same host share one thread.
                    - receiver: slack-homelab
                      group_by:
                        - instance
                      object_matchers:
                        - ["severity", "=~", "critical|warning"]
                      group_wait: 3m
                      group_interval: 10m
                      repeat_interval: 6h
                      routes:
                        # Was 1h. Combined with 13 threads that is what turned one
                        # host power-off into ~78 Slack messages. A critical alert
                        # nobody has acted on in 6h is not made truer by asking
                        # hourly.
                        - receiver: slack-homelab
                          group_by:
                            - instance
                          object_matchers:
                            - ["severity", "=", "critical"]
                          repeat_interval: 6h
            rules.yaml:
              apiVersion: 1
              # Grafana's alert-rule file provisioning ADDS and UPDATES only --
              # it does NOT prune. Deleting a group from `groups` below leaves
              # the rules orphaned in Grafana's database, still evaluating and
              # still able to notify, and they cannot be removed through the UI
              # or API either because they are marked provisioned.
              #
              # Verified the hard way on 2026-08-17: the infra-zfs-health group
              # was removed from this file and Grafana restarted, and all three
              # ZfsPool* rules were still present and still evaluating
              # afterwards. `deleteRules` is the only mechanism that removes
              # them.
              #
              # So: when retiring a rule, delete it from `groups` AND list its
              # uid here. Entries can be pruned from this list once a Grafana
              # restart has actually processed them, but leaving them is
              # harmless and idempotent.
              deleteRules:
                # Retired with the TrueNAS/r720xd estate -- nothing runs ZFS
                # any more. `pve` has no zpools and `pve03` is powered off.
                - orgId: 1
                  uid: zfs-degraded
                - orgId: 1
                  uid: zfs-faulted
                - orgId: 1
                  uid: zfs-unavail
              groups:
                - orgId: 1
                  name: infra-node-health
                  folder: Infra Node Health
                  interval: 60s
                  rules:
                    # STALENESS TEST, NOT A VALUE TEST. See ticket 20.
                    #
                    # The old expression was `up{...}` reduced to `last` with a
                    # `lt 1` threshold. It CANNOT detect a host going down. Every
                    # host reports its own liveness through its own Alloy, which
                    # remote_writes here; when the host dies its Alloy dies with
                    # it, so the series DISAPPEARS rather than going to 0. The
                    # surviving hosts keep the query non-empty so NoData never
                    # trips either, and the rule evaluates the survivors, sees
                    # all 1, and stays green. It was inactive throughout the
                    # 6h37m outage on 2026-08-19.
                    #
                    # `max_over_time(timestamp(up{...})[24h:1m])` is the time of
                    # the most recent sample; `time() - that` is how long the host
                    # has been silent. The 24h window is what keeps the SERIES
                    # present after the samples stop -- that is the whole trick.
                    # Consequence: a host down longer than 24h drops out and the
                    # alert self-resolves. That is accepted; 24h is far past the
                    # point of noticing.
                    #
                    # Threshold 300s is sized against measured behaviour, not
                    # guessed: remote_write interval is 60s on all six hosts
                    # (count_over_time(up[30m]) == 30, uniformly), and the 1m
                    # subquery step adds up to another 60s of quantisation, so a
                    # HEALTHY host reads up to ~125s. Observed healthy maxima:
                    # 103s, 112s, 122s. 300s is ~2.4x that ceiling.
                    #
                    # Do NOT coarsen the subquery to [24h:5m] to save cycles: the
                    # quantisation error grows with the step and healthy hosts
                    # start reading ~300s, which false-positives this rule.
                    #
                    # Replayed against the real outage window, storage reads 27s
                    # before 15:32, 1647s at the first step after, climbing to
                    # 23247s, and back to 26s the moment WoL revived it.
                    - uid: infra-host-down
                      title: InfraHostDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'time() - max_over_time(timestamp(up{job="integrations/unix",source="infra"})[24h:1m])'
                            # MUST stay an instant query. If Grafana ran this as a
                            # RANGE query over relativeTimeRange, EVERY step would
                            # re-evaluate a 24h/1m subquery (1440 points x 6 series)
                            # and the evaluation would be slow enough to risk
                            # execErrState. range:false and maxDataPoints:1 are
                            # belt-and-braces in case `instant` is ignored by a
                            # future schema version -- the reduce below still picks
                            # the last point either way, so the result is correct
                            # regardless; this only bounds the cost.
                            instant: true
                            range: false
                            maxDataPoints: 1
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [300]
                            refId: C
                      for: 2m
                      # Deliberate: if this query goes empty, every infra host has
                      # been silent for 24h or Thanos is broken. Both are worth
                      # waking up for.
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Host {{ "{{" }} $labels.instance {{ "}}" }} has stopped reporting -- no metrics received for over 5 minutes (host down, or its Alloy died)'
                    - uid: fs-space-low
                      title: FilesystemSpaceLow
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.85]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} is over 85% full'
                    - uid: fs-space-critical
                      title: FilesystemSpaceCritical
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.95]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} is critically full (over 95%)'
                    - uid: fs-fill-24h
                      title: FilesystemWillFillIn24h
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 21600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}[6h], 24*3600)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [0]
                            refId: C
                      for: 1h
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} will fill within 24 hours'
                    - uid: high-memory
                      title: HighMemoryUsage
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_memory_MemAvailable_bytes{source="infra"} / node_memory_MemTotal_bytes{source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.90]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Memory usage on {{ "{{" }} $labels.instance {{ "}}" }} is over 90%'
                    - uid: high-cpu
                      title: HighCpuLoad
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle",source="infra"}[10m])))'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.90]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'CPU usage on {{ "{{" }} $labels.instance {{ "}}" }} is over 90%'
                - orgId: 1
                  name: infra-smart-health
                  folder: Infra SMART Health
                  interval: 60s
                  rules:
                    - uid: smart-unhealthy
                      title: SmartDiskUnhealthy
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_smart_status'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'SMART health check FAILED on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-realloc
                      title: SmartReallocatedSectorsGrowing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h])'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Reallocated sectors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-pending
                      title: SmartPendingSectorsGrowing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'increase(smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"}[24h])'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Pending sectors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-temp-high
                      title: SmartDiskTemperatureHigh
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_temperature{temperature_type="current"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [60]
                            refId: C
                      for: 10m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Disk temperature high on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-temp-crit
                      title: SmartDiskTemperatureCritical
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_temperature{temperature_type="current"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [65]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Disk temperature critical on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-nvme-media
                      title: SmartNvmeMediaErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
