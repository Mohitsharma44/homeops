apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "85.x"
    helm:
      valuesObject:
        # CRDs are managed by the separate prometheus-operator-crds Application
        # (sync-wave -1). See docs/monitoring.md "CRD lifecycle" for the
        # upgrade workflow and version invariant.
        crds:
          enabled: false
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            retention: 3d
            retentionSize: 15GB
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
            externalLabels:
              cluster: minipcs
              environment: homelab
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
            thanos:
              objectStorageConfig:
                existingSecret:
                  name: thanos-objstore-secret
                  key: objstore.yml
          thanosService:
            enabled: true
          thanosServiceMonitor:
            enabled: true
        grafana:
          # Use SOPS-encrypted Secret (applied by Flux from
          # kubernetes/infrastructure/configs/grafana-admin-secret.yaml)
          # to prevent Helm from regenerating a random adminPassword on
          # each sync (which would drift from Grafana's DB and break login).
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.sharmamohit.com
          sidecar:
            datasources:
              defaultDatasourceEnabled: false
            dashboards:
              enabled: true
              searchNamespace: monitoring
          # Dashboards managed via Grafana MCP, not helm provisioning
          additionalDataSources:
            - name: Thanos
              type: prometheus
              uid: thanos
              url: http://thanos-query.monitoring.svc:9090
              access: proxy
              isDefault: true
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
              jsonData:
                httpHeaderName1: "X-Scope-OrgID"
                derivedFields:
                  - datasourceUid: tempo
                    matcherRegex: "(?:traceID|trace_id|traceid)=(\\w+)"
                    name: TraceID
                    url: "${__value.raw}"
              secureJsonData:
                httpHeaderValue1: "homelab"
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              access: proxy
              jsonData:
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
          persistence:
            enabled: true
            storageClassName: ceph-block
            size: 2Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          grafana.ini:
            server:
              root_url: https://grafana.sharmamohit.com
            unified_alerting:
              enabled: true
            alerting:
              enabled: false
            # --- PocketID SSO (OIDC) ----------------------------------------
            # Client registered in PocketID UI at https://pocketid.proxy.sharmamohit.com
            # Callback: https://grafana.sharmamohit.com/login/generic_oauth
            # Local admin (grafana-admin secret) remains usable via /login as
            # break-glass — auto_login stays false.
            #
            # Role mapping uses the `groups` claim from PocketID:
            #   group "grafana_admins"  → Admin
            #   group "grafana_editors" → Editor
            #   anything else           → Viewer
            # Names match PocketID's group "Name" field (the claim value), not
            # the "Friendly Name" shown in the UI. Underscores are deliberate.
            # Create those two groups in PocketID and assign users; otherwise
            # all signed-in PocketID users land as Viewer.
            auth:
              disable_login_form: false
              oauth_auto_login: false
            # Config follows PocketID's official Grafana guide
            # (https://pocket-id.org/docs/client-examples/grafana) with two
            # intentional departures (1) signout_redirect_url set so Grafana
            # logout also ends the PocketID session (true SSO logout vs
            # Grafana-only); (2) allow_sign_up: true — PocketID is the access
            # gate (Allowed User Groups on the client), so Grafana auto-
            # provisions instead of duplicating the user roster.
            #
            # role_attribute_strict: true — only users in grafana_admins or
            # grafana_editors can sign in. Anyone else (including users
            # PocketID allowlisted but who aren't in those role groups) is
            # rejected by Grafana with a no-role error. Tighten/loosen here.
            #
            # PocketID quirks:
            # - api_url intentionally omitted: PocketID returns all claims in
            #   the ID token, so Grafana doesn't need a /userinfo round-trip.
            # - email_attribute_name uses Grafana's "email:primary" helper as
            #   PocketID recommends; login/name attributes left to defaults.
            "auth.generic_oauth":
              enabled: true
              name: PocketID
              icon: signin
              allow_sign_up: true
              auto_login: false
              client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid profile email groups
              auth_url: https://pocketid.proxy.sharmamohit.com/authorize
              token_url: https://pocketid.proxy.sharmamohit.com/api/oidc/token
              signout_redirect_url: https://pocketid.proxy.sharmamohit.com/api/oidc/end-session
              use_pkce: true
              use_refresh_token: true
              email_attribute_name: "email:primary"
              role_attribute_path: "contains(groups[*], 'grafana_admins') && 'Admin' || contains(groups[*], 'grafana_editors') && 'Editor' || ''"
              role_attribute_strict: true
          envValueFrom:
            GF_SLACK_WEBHOOK_URL:
              secretKeyRef:
                name: alertmanager-slack-webhook
                key: slack-webhook-url
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-oidc
                key: oauth-client-id
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: oauth-client-secret
          # Grafana Alerting provisioning — sends Slack notifications via Grafana.
          # IMPORTANT: Thresholds here must match additionalPrometheusRulesMap below.
          # Grafana rules feed Slack (via contact point below).
          # Changing a threshold in one place without the other causes drift.
          alerting:
            templates.yaml:
              apiVersion: 1
              templates:
                - orgId: 1
                  name: homelab-slack
                  template: |
                    {{ "{{" }} define "slack.homelab.title" -{{ "}}" }}
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}:fire:{{ "{{" }} else {{ "}}" }}:white_check_mark:{{ "{{" }} end {{ "}}" }} {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
                    {{ "{{" }}- end {{ "}}" }}

                    {{ "{{" }} define "slack.homelab.text" -{{ "}}" }}
                    {{ "{{" }} range .Alerts -{{ "}}" }}
                    *{{ "{{" }} .Labels.severity | toUpper {{ "}}" }}* — {{ "{{" }} .Labels.instance {{ "}}" }}
                    {{ "{{" }} .Annotations.summary {{ "}}" }}
                    :chart_with_upwards_trend: <https://grafana.sharmamohit.com/alerting/list|View Alerts>  {{ "{{" }} if .SilenceURL {{ "}}" }}:no_bell: <{{ "{{" }} .SilenceURL {{ "}}" }}|Silence>{{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} end -{{ "}}" }}
                    {{ "{{" }}- end {{ "}}" }}
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: slack-homelab
                  receivers:
                    - uid: slack-homelab-receiver
                      type: slack
                      disableResolveMessage: false
                      settings:
                        url: $GF_SLACK_WEBHOOK_URL
                        title: '{{ "{{" }} template "slack.homelab.title" . {{ "}}" }}'
                        text: '{{ "{{" }} template "slack.homelab.text" . {{ "}}" }}'
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: slack-homelab
                  group_by:
                    - grafana_folder
                    - alertname
                  group_wait: 3m
                  group_interval: 10m
                  repeat_interval: 6h
                  routes:
                    - receiver: slack-homelab
                      object_matchers:
                        - ["severity", "=", "none"]
                      group_wait: 8760h
                      repeat_interval: 8760h
                      continue: false
                    - receiver: slack-homelab
                      group_by:
                        - alertname
                        - instance
                      object_matchers:
                        - ["severity", "=~", "critical|warning"]
                      group_wait: 3m
                      group_interval: 10m
                      repeat_interval: 6h
                      routes:
                        - receiver: slack-homelab
                          object_matchers:
                            - ["severity", "=", "critical"]
                          repeat_interval: 1h
            rules.yaml:
              apiVersion: 1
              groups:
                - orgId: 1
                  name: infra-node-health
                  folder: Infra Node Health
                  interval: 60s
                  rules:
                    - uid: infra-host-down
                      title: InfraHostDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="integrations/unix",source="infra"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Host {{ "{{" }} $labels.instance {{ "}}" }} is unreachable'
                    - uid: fs-space-low
                      title: FilesystemSpaceLow
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.85]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} is over 85% full'
                    - uid: fs-space-critical
                      title: FilesystemSpaceCritical
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.95]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} is critically full (over 95%)'
                    - uid: fs-fill-24h
                      title: FilesystemWillFillIn24h
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 21600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}[6h], 24*3600)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [0]
                            refId: C
                      for: 1h
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Filesystem {{ "{{" }} $labels.mountpoint {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} will fill within 24 hours'
                    - uid: high-memory
                      title: HighMemoryUsage
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - node_memory_MemAvailable_bytes{instance!="r720xd",source="infra"} / node_memory_MemTotal_bytes{instance!="r720xd",source="infra"})'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.90]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Memory usage on {{ "{{" }} $labels.instance {{ "}}" }} is over 90%'
                    - uid: high-cpu
                      title: HighCpuLoad
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: '(1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle",source="infra"}[10m])))'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.90]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'CPU usage on {{ "{{" }} $labels.instance {{ "}}" }} is over 90%'
                - orgId: 1
                  name: infra-smart-health
                  folder: Infra SMART Health
                  interval: 60s
                  rules:
                    - uid: smart-unhealthy
                      title: SmartDiskUnhealthy
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_smart_status'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: 'SMART health check FAILED on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-realloc
                      title: SmartReallocatedSectorsGrowing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h])'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Reallocated sectors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-pending
                      title: SmartPendingSectorsGrowing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'increase(smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"}[24h])'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Pending sectors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-temp-high
                      title: SmartDiskTemperatureHigh
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_temperature{temperature_type="current"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [60]
                            refId: C
                      for: 10m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Disk temperature high on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-temp-crit
                      title: SmartDiskTemperatureCritical
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_temperature{temperature_type="current"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [65]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Disk temperature critical on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-nvme-media
                      title: SmartNvmeMediaErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 86400
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'increase(smartctl_device_media_errors[24h])'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'NVMe media errors increasing on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-nvme-crit
                      title: SmartNvmeCriticalWarning
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'smartctl_device_critical_warning'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: 'NVMe critical warning on {{ "{{" }} $labels.device {{ "}}" }} ({{ "{{" }} $labels.instance {{ "}}" }})'
                    - uid: smart-exporter-down
                      title: SmartExporterDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="smartctl"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'smartctl_exporter down on {{ "{{" }} $labels.instance {{ "}}" }}'
                - orgId: 1
                  name: infra-zfs-health
                  folder: Infra ZFS Health
                  interval: 30s
                  rules:
                    - uid: zfs-degraded
                      title: ZfsPoolDegraded
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'node_zfs_zpool_state{state="degraded",source="infra"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'ZFS pool {{ "{{" }} $labels.zpool {{ "}}" }} is DEGRADED on {{ "{{" }} $labels.instance {{ "}}" }}'
                    - uid: zfs-faulted
                      title: ZfsPoolFaulted
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'node_zfs_zpool_state{state="faulted",source="infra"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 1m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: 'ZFS pool {{ "{{" }} $labels.zpool {{ "}}" }} is FAULTED on {{ "{{" }} $labels.instance {{ "}}" }}'
                    - uid: zfs-unavail
                      title: ZfsPoolUnavail
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'node_zfs_zpool_state{state="unavail",source="infra"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 1m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: 'ZFS pool {{ "{{" }} $labels.zpool {{ "}}" }} is UNAVAILABLE on {{ "{{" }} $labels.instance {{ "}}" }}'
                - orgId: 1
                  name: infra-watchdog
                  folder: Infra Watchdog
                  interval: 60s
                  rules:
                    - uid: grafana-watchdog
                      title: GrafanaAlertingWatchdog
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'vector(1)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 0s
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: none
                      annotations:
                        summary: "Grafana Alerting is alive"
                # Off-host backup health. Metrics come from the backup-verifier
                # container on the storage host (UGREEN NAS), scraped by
                # server04's Alloy and remote-written here.
                #
                # Both rules use noDataState: Alerting on purpose, unlike the
                # rules above. For a backup, "the metric vanished" and "the
                # backup stopped" are the same incident -- silence is exactly
                # the failure mode being guarded against. The old WebDAV upload
                # broke in ~2026-08-10 and nothing noticed for five days.
                - orgId: 1
                  name: infra-backup-health
                  folder: Infra Backup Health
                  interval: 300s
                  rules:
                    - uid: vaultwarden-backup-stale
                      title: VaultwardenOffHostBackupStale
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 3600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Age, in seconds, of the newest VERIFIED backup in
                            # the archive on the storage host.
                            expr: 'time() - vaultwarden_backup_last_success_timestamp_seconds'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  # 30h: the job runs nightly at 02:00, so this
                                  # fires the morning after a single miss rather
                                  # than waiting for a second one.
                                  params: [108000]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: 'No verified off-host backup of {{ "{{" }} $labels.service {{ "}}" }} from {{ "{{" }} $labels.host {{ "}}" }} in over 30 hours'
                        description: 'Check the vaultwarden-backup container on server04 and the backup-verifier stack on the storage host. Files stuck in /volume1/backup-landing mean the verifier is not running; files in _quarantine mean a backup arrived corrupt.'
                    - uid: backup-verifier-down
                      title: BackupVerifierDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="backup-verifier"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: warning
                      annotations:
                        summary: "backup-verifier on the storage host is not being scraped"
                        description: "Backups may still be landing in /volume1/backup-landing, but nothing is verifying or archiving them, and the freshness alert above is blind."
                # Object store health. Metrics come from Garage's admin API on
                # the storage host and from the garage-snapshotter container
                # beside it, both scraped by server04's Alloy and remote-written
                # here. server04 does the scraping because it already
                # remote_writes and the storage host runs no Alloy of its own.
                #
                # The bar these rules have to clear: the SeaweedFS object store
                # died and Loki, Tempo and Thanos were down for 53 days before
                # anyone noticed, because every Alloy agent stayed healthy and
                # kept shipping. "Container up" would not have caught it either
                # -- ticket 10 produced a store that was reachable, logged no
                # errors and had lost every bucket and key.
                #
                # noDataState is Alerting throughout, as with the backup rules:
                # for a store nothing else has redundancy for, "the metric
                # vanished" and "the store is gone" are the same incident, and
                # silence is the failure mode being guarded against.
                - orgId: 1
                  name: infra-object-store
                  folder: Infra Object Store
                  interval: 300s
                  rules:
                    - uid: object-store-down
                      title: ObjectStoreDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="garage"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store is not answering its admin API"
                        description: "Garage on the storage host is unreachable or its metrics endpoint is failing. Loki, Tempo and Thanos all write here; expect them to start failing if this persists. Check the garage stack in Komodo and the container on 192.168.11.244."
                    - uid: object-store-unavailable
                      title: ObjectStoreUnavailable
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Garage's own verdict on whether it can serve
                            # requests at all, which is stronger than the
                            # process being alive.
                            expr: 'cluster_available'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store says it cannot serve requests"
                        description: "cluster_available is 0. Garage is running but reports it cannot satisfy reads or writes. Check disk on /volume1 and the layout via the admin API on port 3903."
                    - uid: object-store-buckets-missing
                      title: ObjectStoreBucketsMissing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Four buckets are expected: loki-chunks,
                            # loki-ruler, tempo-traces, thanos-metrics.
                            #
                            # This rule exists because of a real failure mode,
                            # not a hypothetical one. Following upstream's
                            # documented restore procedure produced a store
                            # that started with ZERO errors, every table at 0,
                            # no buckets and no keys. Nothing else here would
                            # have noticed: the container was up, the endpoint
                            # answered, and the logs were clean.
                            expr: 'table_size{table_name="bucket_v2"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [4]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store has lost a bucket"
                        description: "Fewer than the expected four buckets exist. This is what a silently emptied store looks like -- reachable, no errors, no data. Do NOT restart anything first; read .scratch/object-store-rehome/issues/10-restore-runbook.md, and note that upstream's own restore documentation destroys the store."
                    - uid: object-store-keys-missing
                      title: ObjectStoreKeysMissing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Three scoped keys are expected: loki, tempo,
                            # thanos. Garage reveals a secret key exactly once,
                            # at creation, so a lost key means reprovisioning
                            # and re-encrypting the consumer secrets.
                            expr: 'table_size{table_name="key"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [3]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store has lost an access key"
                        description: "Fewer than the expected three scoped keys exist. Consumers will start failing authentication. Rebuild with .scratch/object-store-rehome/09-tooling/provision_consumers.py, then re-encrypt object-store-credentials and thanos-objstore-secret."
                    - uid: object-store-server-errors
                      title: ObjectStoreServerErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 900
                            to: 0
                          datasourceUid: thanos
                          model:
                            # 5xx only. 403 and 404 are normal traffic here --
                            # the scoped keys deliberately produce 403s when a
                            # consumer probes a bucket it does not own, and
                            # Thanos and Loki both HEAD objects that do not
                            # exist yet as a matter of course.
                            #
                            # `or vector(0)` is load-bearing. Garage only
                            # creates a counter series once that endpoint and
                            # status code have actually occurred, so with no
                            # 5xx ever recorded the selector matches NOTHING
                            # and the query returns an empty vector -- which
                            # Grafana turns into a DatasourceNoData alert that
                            # still honours `for` and still notifies. Observed:
                            # this rule went Pending on a completely healthy
                            # store. The fallback makes "no errors" evaluate to
                            # 0 instead of to nothing.
                            expr: 'sum(rate(api_s3_error_counter{status_code=~"5.."}[10m])) or vector(0)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.05]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store is returning server errors"
                        description: "Garage is answering S3 requests with 5xx. The store is up but failing requests, so consumers are losing writes. Check container logs and disk health on the storage host."
                    - uid: object-store-metadata-disk-low
                      title: ObjectStoreMetadataDiskLow
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 900
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Metadata, not data. The LMDB is the part with no
                            # redundancy -- replication_factor is 1 -- and a
                            # full metadata volume is how an LMDB gets
                            # corrupted rather than merely full.
                            expr: 'garage_local_disk_avail{volume="metadata"} / garage_local_disk_total{volume="metadata"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [0.1]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store's metadata volume is nearly full"
                        description: "Under 10% free on /volume1, which holds the LMDB. The index has no replica, so filling this volume risks corrupting it rather than simply refusing writes."
                    - uid: object-store-resync-errors
                      title: ObjectStoreResyncErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 1800
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Blocks whose last integrity resync failed. Stayed
                            # at 0 through 201k objects of load testing and two
                            # SIGKILLs, so anything above 0 is meaningful and
                            # not background noise.
                            expr: 'block_resync_errored_blocks'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Alerting
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store cannot verify some data blocks"
                        description: "block_resync_errored_blocks is above zero, meaning Garage failed to re-verify stored blocks. This is the closest thing to a silent-corruption signal the store offers. Check disk and dmesg on the storage host."
                    - uid: garage-snapshot-stale
                      title: GarageSnapshotStale
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 3600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Age, in seconds, of the newest metadata snapshot
                            # on disk. Measured on the filesystem because
                            # Garage exports no snapshot metric at all.
                            expr: 'time() - garage_snapshot_newest_timestamp_seconds'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            # 12h = twice the 6h snapshot interval, so a single
                            # missed run is tolerated and two are not.
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [43200]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "No metadata snapshot of the object store in over 12 hours"
                        description: "The LMDB index has no replica, so a snapshot is its only protection. Garage's own snapshot timer resets on every restart and cannot be relied on -- that is why garage-snapshotter triggers on wall clock. Check that container on the storage host."
                    - uid: garage-snapshotter-down
                      title: GarageSnapshotterDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="garage-snapshotter"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: warning
                      annotations:
                        summary: "garage-snapshotter on the storage host is not being scraped"
                        description: "Snapshots may have stopped being taken, and the staleness alert above is blind while this is down. Check the garage-snapshotter stack in Komodo."
                    - uid: loki-not-ingesting
                      title: LokiNotIngesting
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 1800
                            to: 0
                          datasourceUid: thanos
                          model:
                            # The consumer-side half, and the one that would
                            # have fired on day one of the SeaweedFS outage.
                            # Watching the object store catches the store
                            # breaking; this catches logging being broken for
                            # ANY reason, including reasons nobody predicted.
                            expr: 'sum(rate(loki_distributor_bytes_received_total[15m]))'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 30m
                      noDataState: Alerting
                      execErrState: Alerting
                      labels:
                        severity: critical
                      annotations:
                        summary: "Loki has ingested no logs in 30 minutes"
                        description: "Every Alloy agent can look perfectly healthy while this is true -- that is exactly how the last outage hid for 53 days. Either Loki is down, or it cannot write to the object store. Check loki-0 in the monitoring namespace first."
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: "null"
              group_by: ['alertname', 'instance']
              group_wait: 3m
              group_interval: 10m
              repeat_interval: 6h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
          alertmanagerSpec:
            retention: 120h
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        additionalPrometheusRulesMap:
          infra-node-health:
            groups:
              - name: infra-node-health
                rules:
                  - alert: InfraHostDown
                    expr: up{job="integrations/unix", source="infra"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Host {{ $labels.instance }} is unreachable"
                  - alert: FilesystemSpaceLow
                    expr: |
                      (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"}) > 0.85
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
                  - alert: FilesystemSpaceCritical
                    expr: |
                      (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"}) > 0.95
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is critically full ({{ $value | humanizePercentage }})"
                  - alert: FilesystemWillFillIn24h
                    expr: |
                      predict_linear(
                        node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}[6h],
                        24*3600
                      ) < 0
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24 hours"
                  - alert: HighMemoryUsage
                    expr: |
                      (1 - node_memory_MemAvailable_bytes{instance!="r720xd",source="infra"}
                      / node_memory_MemTotal_bytes{instance!="r720xd",source="infra"}) > 0.90
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Memory usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"
                  - alert: HighCpuLoad
                    expr: |
                      (1 - avg by (instance)
                      (rate(node_cpu_seconds_total{mode="idle",source="infra"}[10m]))) > 0.90
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "CPU usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"
          infra-smart-health:
            groups:
              - name: infra-smart-health
                rules:
                  - alert: SmartDiskUnhealthy
                    expr: smartctl_device_smart_status != 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "SMART health check FAILED on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartReallocatedSectorsGrowing
                    expr: |
                      increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Reallocated sectors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartPendingSectorsGrowing
                    expr: |
                      increase(smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"}[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pending sectors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartDiskTemperatureHigh
                    expr: smartctl_device_temperature{temperature_type="current"} > 60
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Disk temperature {{ $value }}C on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartDiskTemperatureCritical
                    expr: smartctl_device_temperature{temperature_type="current"} > 65
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Disk temperature critical {{ $value }}C on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartNvmeMediaErrors
                    expr: increase(smartctl_device_media_errors[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "NVMe media errors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartNvmeCriticalWarning
                    expr: smartctl_device_critical_warning > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "NVMe critical warning on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartExporterDown
                    expr: up{job="smartctl"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "smartctl_exporter down on {{ $labels.instance }}"
          infra-zfs-health:
            groups:
              - name: infra-zfs-health
                rules:
                  - alert: ZfsPoolDegraded
                    expr: node_zfs_zpool_state{state="degraded", source="infra"} == 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ZFS pool {{ $labels.zpool }} is DEGRADED on {{ $labels.instance }}"
                  - alert: ZfsPoolFaulted
                    expr: node_zfs_zpool_state{state="faulted", source="infra"} == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ZFS pool {{ $labels.zpool }} is FAULTED on {{ $labels.instance }}"
                  - alert: ZfsPoolUnavail
                    expr: node_zfs_zpool_state{state="unavail", source="infra"} == 1
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "ZFS pool {{ $labels.zpool }} is UNAVAILABLE on {{ $labels.instance }}"
          infra-watchdog:
            groups:
              - name: infra-watchdog
                rules:
                  - alert: Watchdog
                    expr: vector(1)
                    labels:
                      severity: none
                    annotations:
                      summary: "Alertmanager is alive"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
