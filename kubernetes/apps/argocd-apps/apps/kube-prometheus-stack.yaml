                        summary: 'smartctl_exporter down on {{ "{{" }} $labels.instance {{ "}}" }}'
                - orgId: 1
                  name: infra-watchdog
                  folder: Infra Watchdog
                  interval: 60s
                  rules:
                    - uid: grafana-watchdog
                      title: GrafanaAlertingWatchdog
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'vector(1)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 0s
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: none
                      annotations:
                        summary: "Grafana Alerting is alive"
                # Off-host backup health. Metrics come from the backup-verifier
                # container on the storage host (UGREEN NAS), scraped by
                # server04's Alloy and remote-written here.
                #
                # Both rules use noDataState: Alerting on purpose, unlike the
                # rules above. For a backup, "the metric vanished" and "the
                # backup stopped" are the same incident -- silence is exactly
                # the failure mode being guarded against. The old WebDAV upload
                # broke in ~2026-08-10 and nothing noticed for five days.
                - orgId: 1
                  name: infra-backup-health
                  folder: Infra Backup Health
                  interval: 300s
                  rules:
                    - uid: vaultwarden-backup-stale
                      title: VaultwardenOffHostBackupStale
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 3600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Age, in seconds, of the newest VERIFIED backup in
                            # the archive on the storage host.
                            expr: 'time() - vaultwarden_backup_last_success_timestamp_seconds'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  # 30h: the job runs nightly at 02:00, so this
                                  # fires the morning after a single miss rather
                                  # than waiting for a second one.
                                  params: [108000]
                            refId: C
                      for: 15m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'No verified off-host backup of {{ "{{" }} $labels.service {{ "}}" }} from {{ "{{" }} $labels.host {{ "}}" }} in over 30 hours'
                        description: 'Check the vaultwarden-backup container on server04 and the backup-verifier stack on the storage host. Files stuck in /volume1/backup-landing mean the verifier is not running; files in _quarantine mean a backup arrived corrupt.'
                    - uid: backup-verifier-down
                      title: BackupVerifierDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="backup-verifier"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      # LOAD-BEARING -- do NOT change to KeepLast. This rule is
                      # `up{job=...} < 1`, which has the same defect the old
                      # InfraHostDown had: when the exporter dies the series
                      # DISAPPEARS rather than going to 0, so the threshold can
                      # never trip. noDataState: Alerting IS the detection
                      # mechanism here. (Better long-term: rewrite as a staleness
                      # test the way InfraHostDown now is.)
                      noDataState: Alerting
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "backup-verifier on the storage host is not being scraped"
                        description: "Backups may still be landing in /volume1/backup-landing, but nothing is verifying or archiving them, and the freshness alert above is blind."
                # Object store health. Metrics come from Garage's admin API on
                # the storage host and from the garage-snapshotter container
                # beside it, both scraped by server04's Alloy and remote-written
                # here. server04 does the scraping because it already
                # remote_writes and the storage host runs no Alloy of its own.
                #
                # The bar these rules have to clear: the SeaweedFS object store
                # died and Loki, Tempo and Thanos were down for 53 days before
                # anyone noticed, because every Alloy agent stayed healthy and
                # kept shipping. "Container up" would not have caught it either
                # -- ticket 10 produced a store that was reachable, logged no
                # errors and had lost every bucket and key.
                #
                # noDataState is Alerting throughout, as with the backup rules:
                # for a store nothing else has redundancy for, "the metric
                # vanished" and "the store is gone" are the same incident, and
                # silence is the failure mode being guarded against.
                - orgId: 1
                  name: infra-object-store
                  folder: Infra Object Store
                  interval: 300s
                  rules:
                    - uid: object-store-down
                      title: ObjectStoreDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="garage"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      # LOAD-BEARING -- do NOT change to KeepLast. This rule is
                      # `up{job=...} < 1`, which has the same defect the old
                      # InfraHostDown had: when the exporter dies the series
                      # DISAPPEARS rather than going to 0, so the threshold can
                      # never trip. noDataState: Alerting IS the detection
                      # mechanism here. (Better long-term: rewrite as a staleness
                      # test the way InfraHostDown now is.)
                      noDataState: Alerting
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store is not answering its admin API"
                        description: "Garage on the storage host is unreachable or its metrics endpoint is failing. Loki, Tempo and Thanos all write here; expect them to start failing if this persists. Check the garage stack in Komodo and the container on 192.168.11.244."
                    - uid: object-store-unavailable
                      title: ObjectStoreUnavailable
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Garage's own verdict on whether it can serve
                            # requests at all, which is stronger than the
                            # process being alive.
                            expr: 'cluster_available'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 5m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store says it cannot serve requests"
                        description: "cluster_available is 0. Garage is running but reports it cannot satisfy reads or writes. Check disk on /volume1 and the layout via the admin API on port 3903."
                    - uid: object-store-buckets-missing
                      title: ObjectStoreBucketsMissing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # FIVE buckets are expected: loki-chunks,
                            # loki-ruler, tempo-traces, thanos-metrics and
                            # drive-files. drive-files was added by ticket 16b
                            # for the SFTPGo drive; the threshold below moved
                            # 4 -> 5 with it. A count rule that is never raised
                            # when a consumer lands under-counts forever and
                            # SILENTLY -- it would keep passing with the drive's
                            # bucket destroyed, which is precisely the failure
                            # it exists to catch.
                            #
                            # This rule exists because of a real failure mode,
                            # not a hypothetical one. Following upstream's
                            # documented restore procedure produced a store
                            # that started with ZERO errors, every table at 0,
                            # no buckets and no keys. Nothing else here would
                            # have noticed: the container was up, the endpoint
                            # answered, and the logs were clean.
                            expr: 'table_size{table_name="bucket_v2"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [5]
                            refId: C
                      for: 15m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store has lost a bucket"
                        description: "Fewer than the expected five buckets exist (loki-chunks, loki-ruler, tempo-traces, thanos-metrics, drive-files). This is what a silently emptied store looks like -- reachable, no errors, no data. Do NOT restart anything first; read .scratch/object-store-rehome/issues/10-restore-runbook.md, and note that upstream's own restore documentation destroys the store."
                    - uid: object-store-keys-missing
                      title: ObjectStoreKeysMissing
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # FOUR scoped keys are expected: loki, tempo,
                            # thanos and drive. Garage reveals a secret key
                            # exactly once, at creation, so a lost key means
                            # reprovisioning and re-encrypting the consumer
                            # secrets. The `drive` key arrived with ticket 16b
                            # and the threshold below moved 3 -> 4 with it, for
                            # the same reason as the bucket count above.
                            expr: 'table_size{table_name="key"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [4]
                            refId: C
                      for: 15m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "The object store has lost an access key"
                        description: "Fewer than the expected four scoped keys exist (loki, tempo, thanos, drive). Consumers will start failing authentication. Rebuild with .scratch/object-store-rehome/09-tooling/provision_consumers.py, then re-encrypt object-store-credentials, thanos-objstore-secret and drive-object-store-credentials."
                    # ----------------------------------------------------
                    # THE 2 TiB DRIVE QUOTA ALERT IS DELIBERATELY ABSENT.
                    #
                    # Ticket 16f asks for "alert at 75% of the 2 T quota" on
                    # drive-files (maxSize 2199023255552; 75% = 1649267441664).
                    # It cannot be built from any series that exists today, and
                    # a rule on an invented metric name is worse than no rule --
                    # it can never fire, and it reads as coverage.
                    #
                    # Checked on 2026-08-17, not assumed:
                    #   group by (__name__) ({job="garage"})  -> 69 names, NONE
                    #   per-bucket. Garage v2.3.0 exports no bucket-size,
                    #   bucket-bytes or bucket-object series at all.
                    #   api_s3_request_counter carries only `api_endpoint`;
                    #   there is no `bucket` label anywhere in the export.
                    #   garage_local_disk_{avail,total} are per-VOLUME and the
                    #   whole of /volume1 is ~10.9 TB shared with Frigate and
                    #   the Vaultwarden backups, so it is not a proxy for a
                    #   2 TiB per-bucket quota.
                    # Alloy applies no metric-dropping relabel to job="garage"
                    #   (docker/stacks/storage/alloy/config.alloy), so the
                    #   scraped set is the raw endpoint, not a filtered view.
                    # Grafana has exactly three datasources (Loki, Tempo,
                    #   Thanos), so an alert rule cannot poll the admin API
                    #   directly either.
                    #
                    # The data DOES exist, just not in Prometheus. Garage's
                    # admin API returns it per bucket:
                    #   GET /v2/GetBucketInfo?globalAlias=drive-files
                    #   -> {"objects":0,"bytes":0,
                    #       "quotas":{"maxSize":2199023255552}}
                    #
                    # So the fix is an exporter, not a metric name. The
                    # precedent is already in this repo and was created for the
                    # identical reason: garage-snapshotter exists solely because
                    # "Garage publishes NO snapshot metric in any of its 44
                    # metric families", and it publishes
                    # garage_snapshot_newest_timestamp_seconds on :9102 which
                    # GarageSnapshotStale below consumes. A sibling that polls
                    # GetBucketInfo and publishes garage_bucket_bytes{bucket=}
                    # plus garage_bucket_quota_max_size_bytes{bucket=} makes the
                    # rule a three-line threshold on
                    #   garage_bucket_bytes{bucket="drive-files"}
                    #     / garage_bucket_quota_max_size_bytes{bucket="drive-files"}
                    #     > 0.75
                    # That exporter is on the storage host, outside this file
                    # and outside 16f's monitoring scope. Filed, not forgotten.
                    #
                    # Until it exists the 2 TiB ceiling is UNMONITORED: Garage
                    # enforces the quota itself and will start refusing writes,
                    # but nothing warns on the way up. Uploads are 0 bytes today
                    # so nothing is at risk yet.
                    # ----------------------------------------------------
                    - uid: object-store-server-errors
                      title: ObjectStoreServerErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 900
                            to: 0
                          datasourceUid: thanos
                          model:
                            # 5xx only. 403 and 404 are normal traffic here --
                            # the scoped keys deliberately produce 403s when a
                            # consumer probes a bucket it does not own, and
                            # Thanos and Loki both HEAD objects that do not
                            # exist yet as a matter of course.
                            #
                            # `or vector(0)` is load-bearing. Garage only
                            # creates a counter series once that endpoint and
                            # status code have actually occurred, so with no
                            # 5xx ever recorded the selector matches NOTHING
                            # and the query returns an empty vector -- which
                            # Grafana turns into a DatasourceNoData alert that
                            # still honours `for` and still notifies. Observed:
                            # this rule went Pending on a completely healthy
                            # store. The fallback makes "no errors" evaluate to
                            # 0 instead of to nothing.
                            expr: 'sum(rate(api_s3_error_counter{status_code=~"5.."}[10m])) or vector(0)'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0.05]
                            refId: C
                      for: 15m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store is returning server errors"
                        description: "Garage is answering S3 requests with 5xx. The store is up but failing requests, so consumers are losing writes. Check container logs and disk health on the storage host."
                    - uid: object-store-metadata-disk-low
                      title: ObjectStoreMetadataDiskLow
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 900
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Metadata, not data. The LMDB is the part with no
                            # redundancy -- replication_factor is 1 -- and a
                            # full metadata volume is how an LMDB gets
                            # corrupted rather than merely full.
                            expr: 'garage_local_disk_avail{volume="metadata"} / garage_local_disk_total{volume="metadata"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [0.1]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store's metadata volume is nearly full"
                        description: "Under 10% free on /volume1, which holds the LMDB. The index has no replica, so filling this volume risks corrupting it rather than simply refusing writes."
                    - uid: object-store-resync-errors
                      title: ObjectStoreResyncErrors
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 1800
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Blocks whose last integrity resync failed. Stayed
                            # at 0 through 201k objects of load testing and two
                            # SIGKILLs, so anything above 0 is meaningful and
                            # not background noise.
                            expr: 'block_resync_errored_blocks'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 30m
                      noDataState: NoData
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "The object store cannot verify some data blocks"
                        description: "block_resync_errored_blocks is above zero, meaning Garage failed to re-verify stored blocks. This is the closest thing to a silent-corruption signal the store offers. Check disk and dmesg on the storage host."
                    - uid: garage-snapshot-stale
                      title: GarageSnapshotStale
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 3600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Age, in seconds, of the newest metadata snapshot
                            # on disk. Measured on the filesystem because
                            # Garage exports no snapshot metric at all.
                            expr: 'time() - garage_snapshot_newest_timestamp_seconds'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            # 12h = twice the 6h snapshot interval, so a single
                            # missed run is tolerated and two are not.
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [43200]
                            refId: C
                      for: 15m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "No metadata snapshot of the object store in over 12 hours"
                        description: "The LMDB index has no replica, so a snapshot is its only protection. Garage's own snapshot timer resets on every restart and cannot be relied on -- that is why garage-snapshotter triggers on wall clock. Check that container on the storage host."
                    - uid: garage-snapshotter-down
                      title: GarageSnapshotterDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="garage-snapshotter"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      # LOAD-BEARING -- do NOT change to KeepLast. This rule is
                      # `up{job=...} < 1`, which has the same defect the old
                      # InfraHostDown had: when the exporter dies the series
                      # DISAPPEARS rather than going to 0, so the threshold can
                      # never trip. noDataState: Alerting IS the detection
                      # mechanism here. (Better long-term: rewrite as a staleness
                      # test the way InfraHostDown now is.)
                      noDataState: Alerting
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "garage-snapshotter on the storage host is not being scraped"
                        description: "Snapshots may have stopped being taken, and the staleness alert above is blind while this is down. Check the garage-snapshotter stack in Komodo."
                    - uid: loki-not-ingesting
                      title: LokiNotIngesting
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 1800
                            to: 0
                          datasourceUid: thanos
                          model:
                            # The consumer-side half, and the one that would
                            # have fired on day one of the SeaweedFS outage.
                            # Watching the object store catches the store
                            # breaking; this catches logging being broken for
                            # ANY reason, including reasons nobody predicted.
                            expr: 'sum(rate(loki_distributor_bytes_received_total[15m]))'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 30m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: "Loki has ingested no logs in 30 minutes"
                        description: "Every Alloy agent can look perfectly healthy while this is true -- that is exactly how the last outage hid for 53 days. Either Loki is down, or it cannot write to the object store. Check loki-0 in the monitoring namespace first."
                # md array health on the storage host.
                #
                # SCOPE NOTE, so this group is not duplicated by accident:
                # the storage host's SMART attributes and host metrics are
                # ALREADY covered. infra-smart-health's rules carry no instance
                # filter at all, and infra-node-health's filter on
                # source="infra" -- both of which the storage host now matches,
                # as of the Alloy stack added 2026-08-17. Reallocated-sector
                # growth, pending sectors, temperature, filesystem fullness and
                # memory therefore needed NO new rules. What follows is only
                # what nothing else covers: the md arrays themselves.
                #
                # node_exporter's mdadm collector supplies the membership
                # metrics. It does not supply scrub state -- sysfs records that
                # a check is running but keeps no record of when one finished
                # -- so md_array_* comes from the md-exporter container beside
                # Garage, which observes the transition and persists it.
                - orgId: 1
                  name: infra-storage-arrays
                  folder: Infra Storage Arrays
                  interval: 300s
                  rules:
                    - uid: md-array-degraded
                      title: MdArrayDegraded
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # on(instance,device) is required, not stylistic:
                            # node_md_disks carries a `state` label that
                            # node_md_disks_required does not, so a default
                            # vector match finds nothing and the rule would
                            # silently never fire.
                            expr: 'node_md_disks_required{source="infra"} - on(instance,device) node_md_disks{source="infra",state="active"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: 'Array {{ "{{" }} $labels.device {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} is missing a member disk'
                        description: "DO NOT TRUST THE DEVICE NUMBER IN THIS ALERT. mdadm.conf has no ARRAY lines and both arrays share one superblock name, so md1/md2 are assigned by assembly order at boot and DID swap across the 2026-08-19 reboot. Resolve level and mount from /proc/mdstat and df before acting. As of 2026-08-22: the RAID6 (4 disks, 10.9 TiB, currently md2) is /volume1 and holds Garage, the only off-host Vaultwarden backup copy and 60 days of Frigate recordings; the RAID1 (2 disks, 1.8 TiB, currently md1) is /volume2 and holds Garage's metadata. RAID6 survives two failures and RAID1 one, but all four RAID6 HDDs are same-batch IronWolfs at ~4.87 years, so treat a first failure as the start of a sequence. Do NOT drive mdadm by hand -- storage_serv owns pool state; repair through the UGOS UI."
                    - uid: md-array-failed-disks
                      title: MdArrayFailedDisks
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'node_md_disks{source="infra",state="failed"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 5m
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: critical
                      annotations:
                        summary: '{{ "{{" }} $labels.device {{ "}}" }} on {{ "{{" }} $labels.instance {{ "}}" }} has a disk marked failed'
                        description: "Distinct from MdArrayDegraded: this fires while the kernel still counts the disk as a member but has marked it faulty. Resolve the array level and mount from /proc/mdstat, not from the device number -- see MdArrayDegraded. sdf is the expected first candidate and it is MOVING again, not plateaued: 1376 reallocated sectors on 2026-08-17, 1552 on 2026-08-19 and still 1552 on 2026-08-22, with Reported_Uncorrect 365 and Current_Pending_Sector 0. sdf is a member of the RAID6 that carries /volume1. All six bays are full and the free M.2 slots are NVMe-only, so there is no hot spare: replacement means a physical swap."
                    # Selects on level, NOT on array. It used to say
                    # array="md1", which was correct only until the 2026-08-19
                    # reboot renumbered the arrays: md1 became the RAID1 and this
                    # rule silently started watching the 1.8 TiB metadata mirror
                    # instead of the 10.9 TiB RAID6 that holds everything. Worse,
                    # the exporter keyed its persisted state by device name too,
                    # so the RAID6's 2026-08-18 scrub was re-attributed to the
                    # RAID1 and the RAID6 read 0. md-exporter.sh now keys state by
                    # the array UUID from sysfs and exports uuid and level labels;
                    # this selector is the consumer side of that fix.
                    #
                    # Scoped to raid6 deliberately: UGOS "Data Organizing" only
                    # scrubs RAID5/6, so the RAID1 has NO scrub path at all and
                    # would alert forever. That gap is real and tracked separately
                    # -- it is not something this rule can express.
                    - uid: md-scrub-stale
                      title: MdArrayScrubStale
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Scoped to md1 deliberately. UGOS's scrub feature
                            # ("Data Organizing") supports RAID5/6 only, so md2
                            # -- a RAID1 -- has no scheduled scrub and would
                            # make this rule fire forever. A rule that fires
                            # forever is worse than no rule; it is how alerting
                            # stops being believed. md2's lack of a scrub path
                            # is a real open gap, tracked in ticket 14, not
                            # something to paper over with an alert nobody can
                            # action.
                            #
                            # A completion timestamp of 0 means "never
                            # observed", which yields a huge age and fires --
                            # that is intended, not a bug.
                            expr: 'time() - md_array_scrub_last_completion_timestamp_seconds{source="infra",level="raid6"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  # 40 days. The UGOS schedule is monthly (18th,
                                  # 03:00); 40 days tolerates a long scrub and a
                                  # slipped start without tolerating a schedule
                                  # that has silently stopped.
                                  params: [3456000]
                            refId: C
                      for: 1h
                      # KeepLast, not Alerting. These metrics come from the
                      # storage host; when it powered off on 2026-08-19 the series
                      # vanished and this rule fired on NoData with a message that
                      # was FLATLY UNTRUE (nothing had lost a bucket / a disk / a
                      # backup). Twelve rules did that at once -- ~78 Slack messages
                      # for one host, none of them correct, while InfraHostDown, the
                      # one rule that should have fired, stayed green. NoData here
                      # means "cannot tell", not "the bad thing happened", so hold
                      # the last known state and let InfraHostDown report the host.
                      noDataState: KeepLast
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'The {{ "{{" }} $labels.level {{ "}}" }} array ({{ "{{" }} $labels.array {{ "}}" }}) has not been scrubbed in over 40 days'
                        description: "UGOS runs the scrub from Storage > Data Organizing, monthly on the 18th at 03:00. If this fires, that schedule has stopped or is failing. Scrubbing is what stops a latent unreadable sector on a surviving drive from surfacing mid-rebuild, which is the exact failure RAID6 was chosen to defend against."
                    - uid: md-parity-mismatch
                      title: MdArrayParityMismatch
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            # Gated on the last sync ACTUALLY having been a
                            # check. mismatch_cnt is meaningless otherwise: on
                            # 2026-08-17 md1 read 7,157,504,848 purely as an
                            # artifact of the RAID5->RAID6 conversion, where the
                            # kernel counts first-time parity computation as
                            # mismatches. Without this gate the rule would have
                            # fired immediately and permanently on a healthy
                            # array.
                            expr: 'md_array_mismatch_cnt{source="infra"} > 0 and on(instance,array) md_array_last_sync_was_check{source="infra"} == 1'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: gt
                                  params: [0]
                            refId: C
                      for: 30m
                      # NoData is correct here and the exception in this group:
                      # the gated expression returns an empty vector whenever
                      # the last sync was not a check, which is the normal state
                      # between scrubs. Alerting on NoData would fire
                      # continuously for exactly that reason.
                      noDataState: OK
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: 'Scrub found {{ "{{" }} $value {{ "}}" }} parity mismatches on {{ "{{" }} $labels.array {{ "}}" }}'
                        description: "The most recent scrub found sectors where parity disagreed with data. On RAID6 this is the nearest thing to a silent-corruption signal. Correlate with SMART on the member drives and with kernel I/O errors in Loki (instance=storage, job=journal) before concluding which disk is at fault."
                    - uid: md-exporter-down
                      title: MdExporterDown
                      condition: C
                      data:
                        - refId: A
                          relativeTimeRange:
                            from: 600
                            to: 0
                          datasourceUid: thanos
                          model:
                            expr: 'up{job="md-exporter"}'
                            refId: A
                        - refId: B
                          datasourceUid: __expr__
                          model:
                            type: reduce
                            expression: A
                            reducer: last
                            refId: B
                        - refId: C
                          datasourceUid: __expr__
                          model:
                            type: threshold
                            expression: B
                            conditions:
                              - evaluator:
                                  type: lt
                                  params: [1]
                            refId: C
                      for: 15m
                      # LOAD-BEARING -- do NOT change to KeepLast. This rule is
                      # `up{job=...} < 1`, which has the same defect the old
                      # InfraHostDown had: when the exporter dies the series
                      # DISAPPEARS rather than going to 0, so the threshold can
                      # never trip. noDataState: Alerting IS the detection
                      # mechanism here. (Better long-term: rewrite as a staleness
                      # test the way InfraHostDown now is.)
                      noDataState: Alerting
                      execErrState: Error
                      labels:
                        severity: warning
                      annotations:
                        summary: "md-exporter on the storage host is not being scraped"
                        description: "The scrub-freshness and parity-mismatch rules above are blind while this is true. Same shape as GarageSnapshotterDown: the alert that guards a freshness metric needs its own liveness alert, or a dead exporter reads as a healthy array."
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: "null"
              group_by: ['alertname', 'instance']
              group_wait: 3m
              group_interval: 10m
              repeat_interval: 6h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: "null"
          alertmanagerSpec:
            retention: 120h
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: ceph-block
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        # Control-plane component monitoring is DISABLED on purpose.
        #
        # Talos binds kube-controller-manager, kube-scheduler and kube-proxy to
        # localhost. The chart nonetheless creates Services and Endpoints
        # pointing at the node IPs (:10257, :10259, :10249), so every scrape
        # fails and `up{job="kube-controller-manager"} == 0` is permanently
        # true. That is a config mismatch, not an outage.
        #
        # The result was 12 alerts firing continuously for 184 days --
        # Kube{ControllerManager,Scheduler,Proxy}InstanceUnreachable across
        # three nodes, plus a TargetDown for each of the three jobs -- each
        # re-notified to Slack every 6h by `repeat_interval`. It was the bulk
        # of the alert spam, and it drowned real signal.
        #
        # `enabled: false` removes the Service, the ServiceMonitor AND the
        # associated rules together, which is why it is the right lever rather
        # than silencing the alerts downstream.
        #
        # NOTE the tradeoff being accepted: there are now no metrics for these
        # three components. That is not a regression -- the scrapes have never
        # once succeeded. Getting them for real means an Omni machine-config
        # patch (bind-address 0.0.0.0 on controller-manager and scheduler,
        # metricsBindAddress on kube-proxy) applied as a rolling change across
        # every node, which is its own piece of work.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeStateMetrics:
          enabled: true
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
        additionalPrometheusRulesMap:
          infra-node-health:
            groups:
              - name: infra-node-health
                rules:
                  # Same staleness fix as the Grafana-provisioned copy above --
                  # see the long comment there for why `up{...} == 0` cannot work.
                  #
                  # NOTE: this copy currently notifies NOTHING. The Alertmanager
                  # config in this file routes to `receiver: "null"` and defines no
                  # other receiver, so Prometheus-side alerts are evaluated and
                  # discarded. Grafana alerting -> slack-homelab is the live path.
                  # Kept correct so it does the right thing if Alertmanager is ever
                  # wired up, rather than sitting here looking like coverage.
                  - alert: InfraHostDown
                    expr: time() - max_over_time(timestamp(up{job="integrations/unix", source="infra"})[24h:1m]) > 300
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Host {{ $labels.instance }} has stopped reporting - no metrics received for over 5 minutes"
                  - alert: FilesystemSpaceLow
                    expr: |
                      (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"}) > 0.85
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
                  - alert: FilesystemSpaceCritical
                    expr: |
                      (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}
                      / node_filesystem_size_bytes{fstype!~"tmpfs|overlay",source="infra"}) > 0.95
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is critically full ({{ $value | humanizePercentage }})"
                  - alert: FilesystemWillFillIn24h
                    expr: |
                      predict_linear(
                        node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",source="infra"}[6h],
                        24*3600
                      ) < 0
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} will fill within 24 hours"
                  - alert: HighMemoryUsage
                    expr: |
                      (1 - node_memory_MemAvailable_bytes{source="infra"}
                      / node_memory_MemTotal_bytes{source="infra"}) > 0.90
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Memory usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"
                  - alert: HighCpuLoad
                    expr: |
                      (1 - avg by (instance)
                      (rate(node_cpu_seconds_total{mode="idle",source="infra"}[10m]))) > 0.90
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: "CPU usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}"
          infra-smart-health:
            groups:
              - name: infra-smart-health
                rules:
                  - alert: SmartDiskUnhealthy
                    expr: smartctl_device_smart_status != 1
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "SMART health check FAILED on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartReallocatedSectorsGrowing
                    expr: |
                      increase(smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"}[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Reallocated sectors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartPendingSectorsGrowing
                    expr: |
                      increase(smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"}[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pending sectors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartDiskTemperatureHigh
                    expr: smartctl_device_temperature{temperature_type="current"} > 60
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Disk temperature {{ $value }}C on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartDiskTemperatureCritical
                    expr: smartctl_device_temperature{temperature_type="current"} > 65
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Disk temperature critical {{ $value }}C on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartNvmeMediaErrors
                    expr: increase(smartctl_device_media_errors[24h]) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "NVMe media errors increasing on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartNvmeCriticalWarning
                    expr: smartctl_device_critical_warning > 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "NVMe critical warning on {{ $labels.device }} ({{ $labels.instance }})"
                  - alert: SmartExporterDown
                    expr: up{job="smartctl"} == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "smartctl_exporter down on {{ $labels.instance }}"
          infra-watchdog:
            groups:
              - name: infra-watchdog
                rules:
                  - alert: Watchdog
                    expr: vector(1)
                    labels:
                      severity: none
                    annotations:
                      summary: "Alertmanager is alive"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
