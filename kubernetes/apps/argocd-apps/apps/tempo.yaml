apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.x"
    helm:
      valuesObject:
        tempo:
          storage:
            trace:
              backend: s3
              s3:
                bucket: tempo-traces
                endpoint: objects.sharmamohit.com:3900
                # Plaintext on the LAN is a deliberate decision (ticket 04), not an
                # oversight. There is no public DNS record for objects.
                insecure: true
                forcepathstyle: true
                # Must match Garage's s3_region. Garage validates the SigV4 region,
                # so "us-east-1" here fails authentication and looks like bad creds.
                region: garage
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: "0.0.0.0:4317"
                http:
                  endpoint: "0.0.0.0:4318"
          retention: 168h
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          extraEnv:
            # Scoped key: reaches tempo-traces and nothing else.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: tempo-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: object-store-credentials
                  key: tempo-secret-access-key
        persistence:
          enabled: true
          storageClassName: ceph-block
          size: 10Gi
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
