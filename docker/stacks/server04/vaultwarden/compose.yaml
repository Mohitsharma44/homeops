services:
  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_proxy
    dns:
      - 9.9.9.9
    env_file: .env
    environment:
      - DOMAIN=https://bitwarden.sharmamohit.com
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_SECURITY=force_tls
    volumes:
      - ./vw-data:/data
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.routers.bitwarden-ui.entrypoints=https
      - traefik.http.routers.bitwarden-ui.tls=true
      - traefik.http.routers.bitwarden-ui.tls.certresolver=http
      - traefik.http.routers.bitwarden-ui.rule=Host(`bitwarden.sharmamohit.com`)
      - traefik.http.routers.bitwarden-ui.service=bitwarden-ui
      - traefik.http.services.bitwarden-ui.loadbalancer.server.port=80
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:3.21
    container_name: vaultwarden-backup
    restart: unless-stopped
    dns:
      - 9.9.9.9
    # Its OWN secret file, not the vaultwarden one -- the backup sidecar has no
    # business holding ADMIN_TOKEN or the SMTP credentials. Supplies
    # BACKUP_SSH_KEY_B64 (base64 of the ed25519 private key for svc-server04 on
    # the storage host). sops-decrypt.sh turns backup.sops.env into backup.env.
    env_file: backup.env
    volumes:
      - ./vw-data:/data:ro
      - /opt/backups/vaultwarden:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache sqlite openssh-client &&
        mkdir -p /run/backup && chmod 700 /run/backup &&
        printf '%s' "$${BACKUP_SSH_KEY_B64}" | base64 -d > /run/backup/id_ed25519 &&
        chmod 600 /run/backup/id_ed25519 &&
        printf '%s\n' "$${SFTP_HOST_KEY}" > /run/backup/known_hosts &&
        echo "$${CRON_SCHEDULE} /usr/local/bin/backup.sh > /proc/1/fd/1 2>/proc/1/fd/2" | crontab - &&
        crond -f -l 2
    environment:
      - CRON_SCHEDULE=0 2 * * *
      - RETENTION_DAYS=180
      # Off-host push target on the storage host (UGREEN NAS). SFTP_DEST is a
      # path inside UGOS's SFTP chroot, which shows share names at /, not real
      # filesystem paths -- /backup-landing here is /volume1/backup-landing on
      # the NAS. The verified archive lives at /volume1/backups/, deliberately
      # OUTSIDE any share, so this identity cannot see or reach it.
      - SFTP_HOST=192.168.11.244
      - SFTP_USER=svc-server04
      - SFTP_DEST=/backup-landing/server04/vaultwarden
      # Host public key, pinned. Not a secret; StrictHostKeyChecking=yes needs it.
      - SFTP_HOST_KEY=192.168.11.244 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIWKiaqZzPwIN2taOTPyYQZ5UEbjQ4zW0BhFmFrrzpZ2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
