name: komodo-core

services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    labels:
      komodo.skip:
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KOMODO_DB_USERNAME:-komodo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${KOMODO_DB_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DB_PASSWORD}
      POSTGRES_DB: postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    labels:
      komodo.skip:
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ferretdb-state:/state
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DB_USERNAME}:${KOMODO_DB_PASSWORD}@postgres:5432/postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  core:
    image: ghcr.io/moghtech/komodo-core:${KOMODO_VERSION}
    labels:
      komodo.skip:
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    network_mode: host
    depends_on:
      ferretdb:
        condition: service_healthy
    env_file: .env
    environment:
      KOMODO_DATABASE_ADDRESS: 127.0.0.1:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      KOMODO_HOST: https://komodo.sharmamohit.com
      KOMODO_TITLE: Komodo
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      # OIDC signups are allowed (PocketID's "Allowed User Groups" on the
      # client is the actual access gate). Local form signups stay blocked.
      KOMODO_DISABLE_OIDC_USER_REGISTRATION: "false"
      # Auto-enable on first sign-in. Komodo's per-user permission model
      # still means a new user has no resource access until an existing
      # admin grants it via the UI (Settings → Users).
      KOMODO_ENABLE_NEW_USERS: "true"
      KOMODO_MONITORING_INTERVAL: "15-sec"
      KOMODO_RESOURCE_POLL_INTERVAL: "1-hr"
      # --- PocketID SSO (OIDC) -------------------------------------------
      # Confidential client (no PKCE). Client ID + Secret in .sops.env.
      # Callback URL to register in PocketID:
      #   https://komodo.sharmamohit.com/auth/oidc/callback
      # Per https://pocket-id.org/docs/client-examples/komodo
      KOMODO_OIDC_ENABLED: "true"
      KOMODO_OIDC_PROVIDER: https://pocketid.proxy.sharmamohit.com
      KOMODO_OIDC_USE_FULL_EMAIL: "true"
      TZ: America/Vancouver
    volumes:
      - /etc/komodo/backups:/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    external: true
    name: komodo_postgres-data
  ferretdb-state:
    external: true
    name: komodo_ferretdb-state
