# Alloy on the storage host.
#
# This is a STANDALONE copy of stacks/shared/alloy, not an override. Komodo
# uses only the first entry of file_paths and does not support compose file
# merge, so customising a shared stack for one host means copying it. Same
# arrangement as racknerd-aegis/alloy-override. Keep the common parts in step
# with stacks/shared/alloy/compose.yaml when that changes.
#
# WHY THIS HOST RUNS ITS OWN ALLOY, when backup-verifier and Garage are
# already scraped from server04:
#
# server04's /etc/alloy/config.alloy is a systemd Alloy edited in place on the
# host and is NOT in git. Three storage-host scrape jobs have been added to it
# so far, each time noting that the gap was getting worse. Ticket 07 closed
# with "do not let it silently grow a fourth time". Adding node metrics, SMART
# and md scrubs from server04 would have been the fourth, fifth and sixth.
#
# Running Alloy here instead puts this host's entire scrape config in the repo,
# scrapes over loopback instead of the LAN, and removes the dependency where
# server04 going down blinds us to the storage host. It costs memory on a box
# where earlyoom is running -- hence the explicit limit below.
#
# UGOS constraint: everything here is containers. UGOS is a vendor OS on
# squashfs + overlay, so APT packages and systemd units are not an option the
# way they are on server04, and anything written outside /volume1 and /volume2
# is erased by a firmware update.

services:
  alloy:
    image: grafana/alloy:v1.18.1
    container_name: alloy
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/rootfs:ro
      # Journal access, so kernel I/O errors are searchable in Loki. This is
      # not generic tidiness: sdf has logged 634 UNC errors, and those surface
      # in the kernel log and nowhere else. A SMART counter tells us a sector
      # was remapped; the journal tells us which read failed and when.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # On /volume2 rather than a docker volume: /volume2 is real storage that
      # survives firmware updates, and Alloy's WAL should not live on the
      # overlay.
      - /volume2/alloy/data:/var/lib/alloy/data
      # The config as a bind-mounted file, NOT a compose `configs:` block.
      # See the note at the foot of this file -- inline config content does not
      # trigger container recreation, so deploys silently no-op.
      - ./config.alloy:/etc/alloy/config.alloy:ro
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - SYS_PTRACE
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --stability.level=generally-available
    # Supplies BASIC_AUTH_USERNAME / BASIC_AUTH_PASSWORD, decrypted by the
    # pre_deploy hook.
    env_file: .env
    environment:
      # Docker reserves HOSTNAME, so the instance label travels as
      # INSTANCE_NAME. "storage" matches the label backup-verifier, garage and
      # garage-snapshotter already carry, so existing dashboards and the
      # infra-object-store alert group keep working unchanged.
      INSTANCE_NAME: storage
      PROMETHEUS_URL: https://prometheus.sharmamohit.com/api/v1/write
      LOKI_URL: https://loki.sharmamohit.com/loki/api/v1/push
    healthcheck:
      # The Alloy v1.16+ image dropped wget and curl. bash IS present, so use
      # /dev/tcp to send a minimal HTTP/1.0 GET and grep the status line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/12345 && printf 'GET /-/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Lower than the shared stack's 768M. This host has ~4.9 Gi
          # available of 7.5 Gi and runs earlyoom, so an unbounded Alloy is a
          # genuine risk to Garage rather than a theoretical one.
          memory: 512M
        reservations:
          memory: 256M

# NOTE: the Alloy config is a bind-mounted FILE (config.alloy), not a compose
# `configs:` block with inline content. That is deliberate and was learned the
# hard way on 2026-08-17.
#
# Docker Compose does not consider a change to inline `configs:` content when
# deciding whether a service needs recreating. Komodo runs `docker compose up
# -d`, compose sees an unchanged service definition, and reports success in
# ~2 seconds having done nothing. The container keeps running the OLD config.
#
# This is genuinely dangerous rather than merely annoying, because it fails
# SILENTLY and in the safe-looking direction: `km execute deploy-stack` says
# EXECUTION SUCCESSFUL, the container is healthy, and the change is simply not
# applied. It cost a full debug cycle here -- a journal-filtering change looked
# deployed for ten minutes while the running container had never restarted.
# The earlier deploy that same evening only worked by accident, because it also
# changed .env, and compose DOES hash env into the container.
#
# With a bind mount the file is whatever Komodo last pulled from git, so
# `km execute restart-stack storage-alloy` is enough to apply a config change.
# Verify it landed by reading the config out of the RUNNING container, not off
# the host:
#     docker exec alloy grep <something-new> /etc/alloy/config.alloy
#
# stacks/shared/alloy still uses the inline `configs:` form and has the same
# latent trap on all five hosts that deploy it.
