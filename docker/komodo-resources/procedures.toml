[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time"
tags = ["system"]
config.schedule = "Every day at 01:00"
config.schedule_alert = true
config.failure_alert = true

[[procedure.config.stage]]
name = "Backup"
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {} }
]

[[procedure]]
name = "Rebuild Periphery Image"
description = "Rebuild custom periphery with latest upstream base image"
tags = ["system", "periphery"]
config.schedule = "Every day at 04:00"

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "periphery-custom" }
]

[[procedure]]
name = "Global Auto Update"
description = "Auto-update stacks and deployments"
tags = ["system"]
config.schedule = "Every day at 05:00"

[[procedure.config.stage]]
name = "Update All"
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params = {} }
]

[[procedure]]
name = "deploy-all-stacks"
description = "Deploy all stacks if changed"
tags = ["deploy"]

[[procedure.config.stage]]
name = "Infrastructure First"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "traefik" },
]

# Komodo v1.19.5 BatchDeployStackIfChanged has only a `pattern` field — no
# `exclude_pattern`. Patterns are name-glob (with `*`/`?`/`[...]`) or regex
# (delimited by `\...\`); there is no negation operator. Upstream issues
# #44 and #954 track adding exclusion support.
#
# So we enumerate the deploy-eligible stacks. Stacks excluded by omission:
#   komodo-core            - Komodo cannot redeploy itself (kills its own process)
#   aegis-pangolin         - severs the WireGuard tunnel Komodo uses to reach VPS
#   aegis-newt             - tunnel client; restart cuts VPS management path
#   aegis-periphery        - Komodo agent on VPS; restart makes VPS unreachable
#   aegis-pangolin-client  - has order dependency on aegis-pangolin; deploy via
#                            deploy-vps-infra procedure instead
#
# These five must be deployed manually via `km execute deploy-stack <name>`
# or via the ordered `deploy-vps-infra` procedure.
[[procedure.config.stage]]
name = "Applications"
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = """
*-alloy
aegis-gateway
aegis-identity
frigate
newt
omni
vaultwarden
""" },
]

[[procedure]]
name = "deploy-vps-infra"
description = "Deploy VPS infrastructure stacks in correct order (gateway → pangolin → pangolin-client → newt → periphery → identity + monitoring)"
tags = ["deploy", "racknerd-aegis"]

[[procedure.config.stage]]
name = "Gateway"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-gateway" },
]

[[procedure.config.stage]]
name = "Pangolin"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-pangolin" },
]

# Pangolin redeploy takes ~2min and drops the WireGuard tunnel while Gerbil restarts.
# Komodo marks the VPS Periphery as unreachable during this window.
# Sleep 30s to let the tunnel re-establish and Komodo re-detect the server as healthy.
[[procedure.config.stage]]
name = "Wait for tunnel recovery"
executions = [
  { execution.type = "Sleep", execution.params.duration_ms = 30000 },
]

# Restart the Machine Client BEFORE downstream stages. Its WireGuard session
# to the K8s newt site can be left in a hung DISCONNECTED state after the
# Pangolin/Gerbil redeploy — recreating the container forces a fresh
# holepunch/relay handshake so the VPS-→Core private route is healthy before
# periphery and identity stacks come up.
[[procedure.config.stage]]
name = "Observability Tunnel"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-pangolin-client" },
]

[[procedure.config.stage]]
name = "Tunnel Agent"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-newt" },
]

[[procedure.config.stage]]
name = "Management Agent"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-periphery" },
]

[[procedure.config.stage]]
name = "Identity and Monitoring"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-identity" },
  { execution.type = "DeployStack", execution.params.stack = "racknerd-aegis-alloy" },
]

# Recovery procedure for the documented deploy-vps-infra failure mode:
# When the Pangolin stage times out (Komodo's WS to VPS Periphery drops during
# the WireGuard restart), the whole procedure aborts and downstream stages
# (including Observability Tunnel) never run. aegis-pangolin-client can be
# left hung — WG to site 10 stuck DISCONNECTED, container silent for minutes —
# and Periphery then can't reach Core via the private route.
#
# Run this procedure to recover. It re-deploys the Machine Client (fresh
# WG state) and then the Periphery (drops its retry backoff and reconnects).
#
# NOTE: pangolin-client-obs's restart rewrites /etc/resolv.conf and clobbers
# the split-DNS routing for *.private.sharmamohit.com. Komodo procedures can't
# run systemd commands, so if Periphery still can't resolve the private domain
# after this procedure, also run on the VPS host:
#   ssh hs sudo systemctl restart pangolin-dns
[[procedure]]
name = "recover-racknerd-aegis-tunnel"
description = "Recover the VPS Periphery↔Core path after a deploy-vps-infra timeout left aegis-pangolin-client in a hung WireGuard state"
tags = ["recovery", "racknerd-aegis"]

[[procedure.config.stage]]
name = "Restart Machine Client"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-pangolin-client" },
]

[[procedure.config.stage]]
name = "Wait for tunnel reconnect"
executions = [
  { execution.type = "Sleep", execution.params.duration_ms = 10000 },
]

[[procedure.config.stage]]
name = "Restart Periphery"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "aegis-periphery" },
]
