[[stack]]
name = "garage"
description = "The object store. S3 on :3900, admin API on :3903, RPC on :3901. Serves Loki, Tempo and Thanos."
tags = ["storage", "object-store"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/garage/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
# Safe to auto-redeploy: every byte of state is in a bind mount, so a recreated
# container reopens the same LMDB, the same node identity and the same layout.
auto_update = true
# No `environment` block on purpose. One would make Komodo write a top-level
# .env and keep passing --env-file forever after, which shadows the
# SOPS-decrypted .env in the compose directory. That trap pinned Komodo Core to
# a stale version for three months.
[stack.config.pre_deploy]
path = "docker/stacks/storage/garage"
command = "sops-decrypt.sh"

[[stack]]
name = "garage-snapshotter"
description = "Triggers Garage metadata snapshots on wall clock, prunes old ones, and exports snapshot freshness on :9102"
tags = ["storage", "object-store", "backup"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/garage-snapshotter/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
auto_update = true
[stack.config.pre_deploy]
path = "docker/stacks/storage/garage-snapshotter"
command = "sops-decrypt.sh"

[[stack]]
name = "backup-verifier"
description = "Verifies backups landed from other hosts and promotes them into the archive; exposes Prometheus metrics on :9101"
tags = ["storage", "backup"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/backup-verifier/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
auto_update = true
# No pre_deploy hook: this stack has no secrets. It reads and writes local
# paths only and does not authenticate anywhere.

[[stack]]
name = "storage-alloy"
description = "Alloy on the storage host: node metrics, SMART, md scrub state, cAdvisor, container + journal logs. Standalone copy of shared/alloy, NOT an override."
tags = ["storage", "monitoring"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/alloy/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
auto_update = true
# No `environment` block on purpose -- see the note on the garage stack above.
# One would make Komodo write a top-level .env and keep passing --env-file
# forever, shadowing the SOPS-decrypted .env in the compose directory.
# INSTANCE_NAME is set inline in the compose file instead.
[stack.config.pre_deploy]
path = "docker/stacks/storage/alloy"
command = "sops-decrypt.sh"

[[stack]]
name = "smartctl-exporter"
description = "SMART attributes for all 7 physical devices on :9633. UGOS schedules the self-tests; this exports the numbers so Grafana can alert on the trend."
tags = ["storage", "monitoring"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/smartctl-exporter/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
auto_update = true
# No pre_deploy hook: this stack has no secrets. It reads devices and serves
# metrics on the LAN; it authenticates nowhere.

[[stack]]
name = "md-exporter"
description = "md array scrub freshness and mismatch_cnt on :9104 -- the parts of array health node_exporter's mdadm collector does not expose. Read-only; never drives mdadm."
tags = ["storage", "monitoring"]
[stack.config]
server_id = "storage"
file_paths = ["docker/stacks/storage/md-exporter/compose.yaml"]
repo = "mohitsharma44/homeops"
branch = "main"
auto_update = true
# No pre_deploy hook: no secrets.
