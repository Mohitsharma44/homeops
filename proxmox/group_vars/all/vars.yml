---
# Proxmox VE Configuration — Shared across all nodes
# Host-specific overrides in host_vars/{hostname}.yml

# ── Core ────────────────────────────────────────────
pve_group: all
pve_cluster_enabled: no

# ── Repository (no-subscription) ────────────────────
pve_repository:
  uris: http://download.proxmox.com/debian/pve
  suites: "{{ ansible_distribution_release }}"
  components: pve-no-subscription
pve_remove_subscription_warning: true
pve_run_proxmox_upgrades: true
pve_check_for_kernel_update: true
pve_reboot_on_kernel_update: false

# ── ZFS ─────────────────────────────────────────────
pve_zfs_enabled: yes
# pve_zfs_options set per-host in host_vars (ARC size depends on RAM)

# ── Users ───────────────────────────────────────────
pve_groups:
  - name: ops
    comment: Operations

pve_users:
  - name: root@pam
    email: mohitsharma44@gmail.com

pve_acls:
  - path: /
    roles: ["Administrator"]
    groups: ["ops"]

# ── Datacenter ──────────────────────────────────────
pve_datacenter_cfg:
  keyboard: en-us

# ── Monitoring (shared) ─────────────────────────────
# alloy_instance_name set per-host in host_vars
alloy_prometheus_url: "https://prometheus.sharmamohit.com/api/v1/write"
alloy_loki_url: "https://loki.sharmamohit.com/loki/api/v1/push"
smartctl_exporter_version: "0.14.0"
smartctl_exporter_checksum: "875983cd27affc5a682401930e5a8eea3f06c325fe6d6a7228c5547d882685b3"
smartctl_exporter_listen: "127.0.0.1:9633"
smartctl_exporter_interval: "120s"

# ── Sanoid (shared template) ────────────────────────
# sanoid_datasets set per-host in host_vars
sanoid_templates:
  data_retention:
    frequently: 0
    hourly: 24
    daily: 30
    weekly: 4
    monthly: 12
    yearly: 2
    autosnap: yes
    autoprune: yes
