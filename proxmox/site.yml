---
- name: Configure Proxmox VE nodes
  hosts: all
  become: true

  pre_tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather facts
      ansible.builtin.setup:

    # ── Local SSD Pool (R720XD only) ─────────────────
    - name: Check if local-ssd pool is active
      ansible.builtin.command: zpool list {{ local_ssd_pool.name }}
      register: local_ssd_pool_active
      changed_when: false
      failed_when: false
      when: local_ssd_pool is defined

    - name: Check if local-ssd pool is importable but not active
      ansible.builtin.shell: zpool import 2>&1 | grep -q "pool:.*{{ local_ssd_pool.name }}"
      register: local_ssd_pool_importable
      changed_when: false
      failed_when: false
      when: local_ssd_pool is defined and local_ssd_pool_active.rc != 0

    - name: Import existing local-ssd pool if found
      ansible.builtin.command: zpool import {{ local_ssd_pool.name }}
      when: >
        local_ssd_pool is defined
        and local_ssd_pool_active.rc != 0
        and local_ssd_pool_importable.rc == 0

    - name: Wipe old partition tables on local-ssd drives
      ansible.builtin.command: sgdisk --zap-all {{ item }}
      loop: "{{ local_ssd_pool.drives }}"
      when: >
        local_ssd_pool is defined
        and local_ssd_pool_active.rc != 0
        and local_ssd_pool_importable.rc != 0

    - name: Create local-ssd ZFS mirror pool
      ansible.builtin.command: >
        zpool create
        -o ashift={{ local_ssd_pool.properties.ashift }}
        -O compression={{ local_ssd_pool.properties.compression }}
        -O atime={{ local_ssd_pool.properties.atime }}
        -O acltype=posixacl
        -O xattr=sa
        -O dnodesize=auto
        {{ local_ssd_pool.name }}
        {{ local_ssd_pool.vdev }}
        {{ local_ssd_pool.drives | join(' ') }}
      when: >
        local_ssd_pool is defined
        and local_ssd_pool_active.rc != 0
        and local_ssd_pool_importable.rc != 0

  roles:
    - role: lae.proxmox

  tasks:
    # ── NFS Export (only hosts with nfs_exports defined) ──
    - name: Install NFS kernel server
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - nfs-common
        state: present
      when: nfs_exports is defined and nfs_exports | length > 0

    - name: Ensure NFS export directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ nfs_exports }}"
      when: nfs_exports is defined

    - name: Configure NFS exports
      ansible.builtin.lineinfile:
        path: /etc/exports
        line: "{{ item.path }} {{ item.network }}({{ item.options }})"
        regexp: "^{{ item.path | regex_escape }}\\s"
        create: yes
      loop: "{{ nfs_exports }}"
      when: nfs_exports is defined
      notify: reload nfs exports

    - name: Enable and start NFS server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: started
        enabled: yes
      when: nfs_exports is defined and nfs_exports | length > 0

    # ── Sanoid (ZFS Snapshots) ────────────────────────
    - name: Install Sanoid
      ansible.builtin.apt:
        name: sanoid
        state: present

    - name: Ensure Sanoid config directory exists
      ansible.builtin.file:
        path: /etc/sanoid
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Sanoid config
      ansible.builtin.template:
        src: sanoid.conf.j2
        dest: /etc/sanoid/sanoid.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart sanoid timer

    - name: Enable Sanoid timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - sanoid.timer

    # ── Grafana APT Repository ────────────────────────
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /tmp/grafana-gpg.key
        mode: "0644"

    - name: Dearmor and install Grafana GPG key
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /etc/apt/keyrings/grafana.gpg /tmp/grafana-gpg.key
        creates: /etc/apt/keyrings/grafana.gpg

    - name: Set Grafana keyring permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/grafana.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Add Grafana APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        filename: grafana
        state: present
        update_cache: yes

    # ── Alloy ─────────────────────────────────────────
    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present

    - name: Deploy Alloy config
      ansible.builtin.template:
        src: alloy-config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"
      notify: restart alloy

    - name: Deploy Alloy environment file
      ansible.builtin.template:
        src: alloy-env.j2
        dest: /etc/default/alloy-env
        owner: root
        group: root
        mode: "0600"
      notify: restart alloy

    - name: Ensure Alloy systemd override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure Alloy systemd override for env file
      ansible.builtin.copy:
        dest: /etc/systemd/system/alloy.service.d/override.conf
        content: |
          [Service]
          EnvironmentFile=/etc/default/alloy-env
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon reload
        - restart alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        state: started
        enabled: yes

    # ── smartctl-exporter ─────────────────────────────
    - name: Install smartmontools
      ansible.builtin.apt:
        name: smartmontools
        state: present

    - name: Check installed smartctl_exporter version
      ansible.builtin.shell: /usr/local/bin/smartctl_exporter --version 2>&1 | grep -q "version {{ smartctl_exporter_version }}"
      register: smartctl_version_match
      changed_when: false
      failed_when: false

    - name: Download smartctl_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus-community/smartctl_exporter/releases/download/v{{ smartctl_exporter_version }}/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/smartctl_exporter.tar.gz
        checksum: "sha256:{{ smartctl_exporter_checksum }}"
      when: smartctl_version_match.rc != 0

    - name: Extract smartctl_exporter
      ansible.builtin.unarchive:
        src: /tmp/smartctl_exporter.tar.gz
        dest: /tmp/
        remote_src: yes
      when: smartctl_version_match.rc != 0

    - name: Install smartctl_exporter binary
      ansible.builtin.copy:
        src: "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64/smartctl_exporter"
        dest: /usr/local/bin/smartctl_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: yes
      when: smartctl_version_match.rc != 0
      notify: restart smartctl-exporter

    - name: Clean up smartctl_exporter temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/smartctl_exporter.tar.gz
        - "/tmp/smartctl_exporter-{{ smartctl_exporter_version }}.linux-amd64"
      when: smartctl_version_match.rc != 0

    - name: Deploy smartctl-exporter systemd service
      ansible.builtin.template:
        src: smartctl-exporter.service.j2
        dest: /etc/systemd/system/smartctl-exporter.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon reload
        - restart smartctl-exporter

    - name: Enable and start smartctl-exporter
      ansible.builtin.systemd:
        name: smartctl-exporter
        state: started
        enabled: yes

  handlers:
    - name: reload nfs exports
      ansible.builtin.command: exportfs -ra

    - name: restart sanoid timer
      ansible.builtin.systemd:
        name: sanoid.timer
        state: restarted

    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted

    - name: restart smartctl-exporter
      ansible.builtin.systemd:
        name: smartctl-exporter
        state: restarted
