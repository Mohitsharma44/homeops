---
# Media Stack — NFS setup + LXC creation + Docker deployment
# Usage: ansible-playbook proxmox/media-stack.yml
# Spec: docs/superpowers/specs/2026-03-18-media-stack-design.md
#
# Prerequisites:
#   - site.yml has been run on r720xd (NFS server config)
#   - SOPS secrets populated (vault_rd_api_key, vault_pve03_api_password, etc.)

# ═══════════════════════════════════════════════════════
# Play 1: Ensure r720xd NFS export for media
# Must run BEFORE Play 3 (LXC mounts NFS from r720xd)
# ═══════════════════════════════════════════════════════
- name: Ensure r720xd NFS export for media
  hosts: r720xd
  become: true
  gather_facts: false

  tasks:
    - name: Ensure pool0/media dataset exists
      ansible.builtin.command:
        cmd: zfs create pool0/media
      register: zfs_create
      changed_when: zfs_create.rc == 0
      failed_when: zfs_create.rc != 0 and 'dataset already exists' not in zfs_create.stderr

    - name: Set pool0/media ownership
      ansible.builtin.file:
        path: /mnt/pool0/media
        owner: 1100
        group: 1100
        mode: "0755"
        state: directory

# ═══════════════════════════════════════════════════════
# Play 2: Create and configure LXC on pve03
# ═══════════════════════════════════════════════════════
- name: Create media-stack LXC on pve03
  hosts: pve03
  become: true
  gather_facts: true

  tasks:
    - name: Ensure proxmoxer Python library is installed
      ansible.builtin.apt:
        name: python3-proxmoxer
        state: present

    - name: Check if Debian 13 LXC template exists
      ansible.builtin.stat:
        path: "/var/lib/vz/template/cache/{{ media_stack_ostemplate | regex_replace('^local:vztmpl/', '') }}"
      register: lxc_template

    - name: Download Debian 13 LXC template
      ansible.builtin.command:
        cmd: "pveam download local {{ media_stack_ostemplate | regex_replace('^local:vztmpl/', '') }}"
      when: not lxc_template.stat.exists

    - name: Check if SSH key pair exists
      ansible.builtin.stat:
        path: /root/.ssh/id_ed25519.pub
      register: ssh_key_stat

    - name: Generate SSH key pair if not present
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ""
        creates: /root/.ssh/id_ed25519.pub
      when: not ssh_key_stat.stat.exists

    - name: Read pve03 root SSH public key
      ansible.builtin.slurp:
        src: /root/.ssh/id_ed25519.pub
      register: pve03_root_pubkey

    - name: Create media-stack LXC
      community.general.proxmox:
        vmid: "{{ media_stack_vmid }}"
        hostname: "{{ media_stack_hostname }}"
        node: "{{ ansible_hostname }}"
        api_user: root@pam
        api_password: "{{ vault_pve03_api_password }}"
        api_host: "{{ ansible_host }}"
        ostemplate: "{{ media_stack_ostemplate }}"
        storage: "{{ media_stack_storage }}"
        disk: "{{ media_stack_disk_size }}"
        cores: "{{ media_stack_cores }}"
        memory: "{{ media_stack_memory }}"
        swap: "{{ media_stack_swap }}"
        unprivileged: false
        features:
          - "nesting=1,fuse=1"
        netif:
          net0: "name=eth0,gw={{ media_stack_gateway }},ip={{ media_stack_ip }}/24,bridge=vmbr0"
        nameserver: "{{ media_stack_nameserver }}"
        pubkey: "{{ pve03_root_pubkey.content | b64decode | trim }}"
        onboot: true
        state: present
      register: lxc_created

    - name: Configure GPU passthrough in LXC config
      ansible.builtin.blockinfile:
        path: "/etc/pve/lxc/{{ media_stack_vmid }}.conf"
        marker: "# {mark} ANSIBLE MANAGED — GPU + FUSE passthrough"
        block: |
          lxc.cgroup2.devices.allow: c 226:* rwm
          lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
          lxc.cgroup2.devices.allow: c 10:229 rwm
          lxc.mount.entry: /dev/fuse dev/fuse none bind,optional,create=file

    - name: Start media-stack LXC
      community.general.proxmox:
        vmid: "{{ media_stack_vmid }}"
        node: "{{ ansible_hostname }}"
        api_user: root@pam
        api_password: "{{ vault_pve03_api_password }}"
        api_host: "{{ ansible_host }}"
        state: started

    - name: Wait for SSH to become available on media-stack LXC
      ansible.builtin.wait_for:
        host: "{{ media_stack_ip }}"
        port: 22
        delay: 5
        timeout: 120

    - name: Add media-stack to known_hosts
      ansible.builtin.known_hosts:
        name: "{{ media_stack_ip }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' + media_stack_ip + ' 2>/dev/null') }}"
        state: present

# ═══════════════════════════════════════════════════════
# Play 3: Configure Docker + deploy stack inside LXC
# ═══════════════════════════════════════════════════════
- name: Configure media-stack LXC
  hosts: media-stack
  become: true
  gather_facts: true

  tasks:
    # ── System setup ──────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - nfs-common
          - fuse3
          - libfuse2
        state: present

    - name: Create media group
      ansible.builtin.group:
        name: media
        gid: "{{ media_stack_pgid }}"
        state: present

    - name: Create media user
      ansible.builtin.user:
        name: media
        uid: "{{ media_stack_puid }}"
        group: media
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    # ── Mount propagation for Docker FUSE ──────────────
    - name: Deploy make-rshared systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/make-rshared.service
        content: |
          [Unit]
          Description=Set root mount to rshared for Docker FUSE propagation
          Before=docker.service
          After=local-fs.target

          [Service]
          Type=oneshot
          ExecStart=/bin/mount --make-rshared /
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify: daemon reload

    - name: Enable make-rshared service
      ansible.builtin.systemd:
        name: make-rshared
        enabled: yes
        state: started

    # ── Docker CE installation ────────────────────────
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /tmp/docker-gpg.key
        mode: "0644"

    - name: Dearmor and install Docker GPG key
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /etc/apt/keyrings/docker.gpg /tmp/docker-gpg.key
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set Docker keyring permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: yes

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # ── Docker daemon log rotation ─────────────────────
    - name: Deploy Docker daemon config (log rotation)
      ansible.builtin.template:
        src: media-stack-docker-daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      notify: restart docker

    - name: Ensure Docker is running with latest config
      ansible.builtin.meta: flush_handlers

    # ── NFS mount ─────────────────────────────────────
    - name: Create local media mount point
      ansible.builtin.file:
        path: /mnt/local-media
        state: directory
        owner: "{{ media_stack_puid }}"
        group: "{{ media_stack_pgid }}"
        mode: "0755"

    - name: Configure NFS mount in fstab
      ansible.posix.mount:
        src: "{{ media_stack_nfs_server }}:{{ media_stack_nfs_path }}"
        path: /mnt/local-media
        fstype: nfs
        opts: rw,soft,intr
        state: mounted

    # ── Directory structure ───────────────────────────
    - name: Create media stack directories
      ansible.builtin.file:
        path: "/opt/media-stack/config/{{ item }}"
        state: directory
        owner: "{{ media_stack_puid }}"
        group: "{{ media_stack_pgid }}"
        mode: "0755"
      loop:
        - jellyfin
        - radarr
        - sonarr
        - prowlarr
        - bazarr
        - jellyseerr
        - decypharr
        - suggestarr
        - tunarr
        - profilarr
        - jellystat-db

    - name: Create debrid mount point
      ansible.builtin.file:
        path: /mnt/debrid
        state: directory
        owner: "{{ media_stack_puid }}"
        group: "{{ media_stack_pgid }}"
        mode: "0755"

    - name: Create local media subdirectories
      ansible.builtin.file:
        path: "/mnt/local-media/{{ item }}"
        state: directory
        owner: "{{ media_stack_puid }}"
        group: "{{ media_stack_pgid }}"
        mode: "0755"
      loop:
        - movies
        - tv

    # ── Deploy configs ────────────────────────────────
    - name: Deploy Decypharr config
      ansible.builtin.template:
        src: decypharr-config.json.j2
        dest: /opt/media-stack/config/decypharr/config.json
        owner: "{{ media_stack_puid }}"
        group: "{{ media_stack_pgid }}"
        mode: "0600"
      register: decypharr_config_changed

    - name: Deploy environment file
      ansible.builtin.template:
        src: media-stack-env.j2
        dest: /opt/media-stack/.env
        owner: root
        group: root
        mode: "0600"
      register: env_changed

    - name: Deploy Docker Compose file
      ansible.builtin.template:
        src: media-stack-compose.yaml.j2
        dest: /opt/media-stack/compose.yaml
        owner: root
        group: root
        mode: "0644"
      register: compose_changed

    # ── Start/update the stack ────────────────────────
    - name: Deploy media stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/media-stack
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
      when: compose_changed.changed or env_changed.changed or decypharr_config_changed.changed

    - name: Ensure media stack is running
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /opt/media-stack
      changed_when: false
      when: not (compose_changed.changed or env_changed.changed or decypharr_config_changed.changed)

  handlers:
    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

# ═══════════════════════════════════════════════════════
# Play 4: Deploy monitoring (Alloy + cron jobs)
# Runs on media-stack LXC after Docker stack is up
# ═══════════════════════════════════════════════════════
- name: Deploy media-stack monitoring
  hosts: media-stack
  become: true
  gather_facts: true

  tasks:
    # ── Prerequisites ──────────────────────────────────
    - name: Install monitoring prerequisites
      ansible.builtin.apt:
        name:
          - jq
          - curl
          - gnupg
        state: present

    # ── Grafana APT repo + Alloy install ───────────────
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana GPG key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: /tmp/grafana-gpg.key
        mode: "0644"

    - name: Dearmor and install Grafana GPG key
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /etc/apt/keyrings/grafana.gpg /tmp/grafana-gpg.key
        creates: /etc/apt/keyrings/grafana.gpg

    - name: Set Grafana keyring permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/grafana.gpg
        mode: "0644"

    - name: Add Grafana APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
        filename: grafana
        state: present
        update_cache: yes

    - name: Install Alloy
      ansible.builtin.apt:
        name: alloy
        state: present

    # ── Alloy config deployment ────────────────────────
    - name: Deploy Alloy River config
      ansible.builtin.template:
        src: media-stack-alloy.config.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: root
        mode: "0644"
      notify: restart alloy

    - name: Deploy Alloy credentials env file
      ansible.builtin.template:
        src: media-stack-alloy-env.j2
        dest: /etc/alloy/env
        owner: root
        group: root
        mode: "0600"
      notify: restart alloy

    - name: Create Alloy systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: "0755"

    - name: Deploy Alloy systemd override
      ansible.builtin.template:
        src: media-stack-alloy-override.conf.j2
        dest: /etc/systemd/system/alloy.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - daemon reload
        - restart alloy

    - name: Add alloy user to required groups
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal,docker
        append: yes
      notify: restart alloy

    - name: Create textfile collector directory
      ansible.builtin.file:
        path: /var/lib/alloy/textfile
        state: directory
        owner: alloy
        group: alloy
        mode: "0755"

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        state: started
        enabled: yes

    # ── RD expiry check cron ───────────────────────────
    - name: Deploy RD expiry check script
      ansible.builtin.template:
        src: media-stack-rd-expiry-check.sh.j2
        dest: /opt/media-stack/rd-expiry-check.sh
        owner: root
        group: root
        mode: "0700"

    - name: Schedule daily RD expiry check (03:00)
      ansible.builtin.cron:
        name: "RD account expiry check"
        hour: "3"
        minute: "0"
        job: "/opt/media-stack/rd-expiry-check.sh"

    - name: Run RD expiry check once to seed initial metric
      ansible.builtin.command:
        cmd: /opt/media-stack/rd-expiry-check.sh
      changed_when: false

    # ── FUSE mount health cron ─────────────────────────
    - name: Deploy FUSE mount check script
      ansible.builtin.template:
        src: media-stack-fuse-check.sh.j2
        dest: /opt/media-stack/fuse-check.sh
        owner: root
        group: root
        mode: "0700"

    - name: Schedule FUSE mount health check (every 5 min)
      ansible.builtin.cron:
        name: "FUSE mount health check"
        minute: "*/5"
        job: "/opt/media-stack/fuse-check.sh"

    - name: Run FUSE check once to seed initial metric
      ansible.builtin.command:
        cmd: /opt/media-stack/fuse-check.sh
      changed_when: false

    # ── Jellyfin Prometheus metrics ──────────────────────
    # Jellyfin exposes /metrics (Prometheus format) when EnableMetrics
    # is set to true in its server configuration. This is a built-in
    # feature, not a separate plugin. The Alloy config already scrapes
    # 127.0.0.1:8096/metrics — these tasks ensure the endpoint is active.
    #
    # API reference:
    #   GET  /System/Configuration  → returns ServerConfiguration JSON
    #   POST /System/Configuration  → updates ServerConfiguration
    #   Auth: X-Emby-Token header with API key
    #   GET  /Plugins               → list installed plugins (unused here;
    #                                  /metrics is a core feature)

    # ── Jellyfin Prometheus metrics ───────────────────
    # EnableMetrics is a built-in Jellyfin feature (not a plugin).
    # Must be set in system.xml and requires a container restart.
    # The API-based approach is fragile; direct XML edit is reliable.
    - name: Wait for Jellyfin system.xml to exist
      ansible.builtin.wait_for:
        path: /opt/media-stack/config/jellyfin/config/system.xml
        timeout: 120

    - name: Enable Jellyfin Prometheus metrics in system.xml
      ansible.builtin.lineinfile:
        path: /opt/media-stack/config/jellyfin/config/system.xml
        regexp: '<EnableMetrics>.*</EnableMetrics>'
        line: '  <EnableMetrics>true</EnableMetrics>'
        insertbefore: '</ServerConfiguration>'
      register: jellyfin_metrics_config

    - name: Restart Jellyfin container to activate metrics endpoint
      ansible.builtin.command:
        cmd: docker compose restart jellyfin
        chdir: /opt/media-stack
      when: jellyfin_metrics_config is changed
      changed_when: true

  handlers:
    - name: daemon reload
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
