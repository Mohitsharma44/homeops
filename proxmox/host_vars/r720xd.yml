---
# R720XD — Dell R720XD, 256GB RAM, 14 drives
# IP: 192.168.11.15

# ── ZFS ARC ─────────────────────────────────────────
# 192GB (leaves 64GB for VMs/system out of 256GB total)
pve_zfs_options: "zfs_arc_max=206158430208"

# ── Storage Backends ────────────────────────────────
pve_storages:
  - name: pool0-store
    type: zfspool
    content: ["images", "rootdir"]
    pool: pool0
    sparse: true

  - name: ssdpool0-store
    type: zfspool
    content: ["images", "rootdir"]
    pool: ssdpool0
    sparse: true

  - name: local-ssd
    type: zfspool
    content: ["images", "rootdir"]
    pool: local-ssd
    sparse: true

# ── Local SSD Pool Creation ─────────────────────────
# ZFS mirror on 2x Samsung 870 EVO 1TB (was TrueNAS ssdpool1)
local_ssd_pool:
  name: local-ssd
  vdev: mirror
  drives:
    - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S625NZ0R909545W
    - /dev/disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S625NZ0R909519P
  properties:
    ashift: 12
    compression: lz4
    atime: "off"

# ── NFS Export ──────────────────────────────────────
nfs_exports:
  - path: /mnt/pool0/nvr
    network: "192.168.11.0/24"
    options: "rw,sync,no_subtree_check,no_root_squash"

# ── Monitoring ──────────────────────────────────────
alloy_instance_name: "r720xd"

# ── Sanoid ──────────────────────────────────────────
sanoid_datasets:
  - name: "pool0/nvr"
    template: data_retention
    recursive: yes
  - name: "ssdpool0"
    template: data_retention
    recursive: yes
