---
# pve03 — AMD Ryzen 5 8500G Mini PC, 30GB RAM, 1TB NVMe
# IP: 192.168.11.12
# Purpose: Media center (Jellyfin, *arr stack)

# ── ZFS ARC ─────────────────────────────────────────
# 4GB (leaves ~26GB for VMs/LXCs out of 30GB total)
# rpool only serves OS + VM images, not bulk media
pve_zfs_options: "zfs_arc_max=4294967296"

# ── Storage Backends ────────────────────────────────
# rpool/data (local-zfs) already configured by installer
pve_storages: []

# ── Monitoring ──────────────────────────────────────
alloy_instance_name: "pve03"

# ── Sanoid ──────────────────────────────────────────
sanoid_datasets:
  - name: "rpool"
    template: data_retention
    recursive: yes

# ── Media Stack LXC ───────────────────────────────────
media_stack_vmid: 400
media_stack_hostname: "media-stack"
media_stack_ip: "192.168.11.40"
media_stack_gateway: "192.168.11.1"
media_stack_nameserver: "192.168.11.1 9.9.9.9"
media_stack_cores: 4
media_stack_memory: 16384
media_stack_swap: 2048
media_stack_disk_size: 64
media_stack_storage: "local-zfs"
media_stack_ostemplate: "local:vztmpl/debian-13-standard_13.1-2_amd64.tar.zst"
media_stack_puid: 1100
media_stack_pgid: 1100
